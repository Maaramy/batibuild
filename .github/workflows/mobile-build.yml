# BatiBuild — Build mobile automatique sur EAS Build (Android + iOS)
#
# Déclencheurs :
#   - workflow_dispatch (manuel) : choix de la plateforme (android / ios / all)
#     et du profil EAS (preview / production)
#   - push sur la branche principale : ne concerne que le dossier mobile/
#     (build Android preview — APK installable en artefact)
#
# Prérequis (une seule fois) :
#   1. Créer un token Expo : https://expo.dev/settings/access-tokens
#   2. GitHub → Settings → Secrets and variables → Actions → New repository secret
#      Nom : EXPO_TOKEN   Valeur : le token créé
#   3. (Recommandé) Lier le projet EAS une première fois en local :
#      cd mobile && bunx eas-cli login && bunx eas-cli init
#      (sinon le job « Ensure EAS project is linked » le fait au premier run)
#
# Notes :
#   - iOS profil « preview » : build simulateur, aucun compte Apple requis.
#   - iOS profil « production » : EAS gère les certificats/provisioning du
#     compte Apple Developer lié au compte Expo. Sans credentials Apple dans le
#     compte EAS, ce build échouera proprement (voir MOBILE_SETUP.md).
#   - Aucun secret n'est écrit dans le dépôt : EXPO_TOKEN vient uniquement de
#     GitHub Secrets.

name: Mobile Build (EAS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à builder"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "Profil EAS (preview = test, production = store)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  typecheck:
    name: Typecheck (mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mobile
        run: bun run typecheck

  resolve:
    name: Résolution des plateformes
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
      profile: ${{ steps.set.outputs.profile }}
    steps:
      - id: set
        run: |
          P="${{ inputs.platform || 'android' }}"
          PROF="${{ inputs.profile || 'preview' }}"
          case "$P" in
            all) echo 'platforms=["android","ios"]' >> "$GITHUB_OUTPUT" ;;
            *)   echo "platforms=[\"$P\"]" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "profile=$PROF" >> "$GITHUB_OUTPUT"

  build:
    name: Build EAS — ${{ matrix.platform }}
    needs: [typecheck, resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.resolve.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Ensure EAS project is linked
        working-directory: mobile
        run: |
          if ! grep -q '"projectId"' app.json; then
            echo "::warning::Projet non lié à EAS — exécution de 'eas init'..."
            npx eas-cli init --non-interactive \
              || { echo "::error::Impossible de lier le projet EAS automatiquement. Lancez 'eas login' puis 'eas init' en local, ou vérifiez le secret EXPO_TOKEN."; exit 1; }
          fi

      - name: Build on EAS
        id: build
        working-directory: mobile
        run: |
          set -o pipefail
          eas build \
            --platform "${{ matrix.platform }}" \
            --profile "${{ needs.resolve.outputs.profile }}" \
            --non-interactive \
            --output ./build-output \
            --message "CI: ${{ github.sha }} (${{ github.ref_name }})" \
            2>&1 | tee build.log
          EAS_URL=$(grep -oE "https://expo.dev/accounts/[^ ]+/builds/[A-Za-z0-9-]+" build.log | head -1 || true)
          echo "eas_url=$EAS_URL" >> "$GITHUB_OUTPUT"
          echo "Artifact(s) produced:"
          ls -la build-output/ 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: batibuild-${{ matrix.platform }}-${{ github.sha }}
          path: mobile/build-output/*
          if-no-files-found: warn
          retention-days: 30

      - name: Post run summary
        if: always()
        run: |
          {
            echo "## 📱 BatiBuild — Build EAS (${{ matrix.platform }})"
            echo ""
            echo "- **Commit** : \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)"
            echo "- **Profil** : \`${{ needs.resolve.outputs.profile }}\`"
            if [ -n "${{ steps.build.outputs.eas_url }}" ]; then
              echo "- **Suivi du build EAS** : ${{ steps.build.outputs.eas_url }}"
            fi
            echo "- **Artefact** : dans l'onglet *Artifacts* de ce run"
          } >> "$GITHUB_STEP_SUMMARY"