# BatiBuild Mobile — Build Android (APK debug + APK release + AAB release)
#
# Déclencheurs :
#   - push sur main (uniquement si mobile/ ou ce workflow change)
#   - workflow_dispatch (Actions → Run workflow)
#
# Artefacts téléchargeables après le run :
#   - Batibuild-debug.apk      (signé clé debug — tests rapides sur téléphone)
#   - Batibuild-release.apk    (signé clé Release si les secrets sont définis,
#                               sinon clé debug — installation manuelle)
#   - Batibuild-release.aab    (Google Play — nécessite la vraie clé Release)
#
# Secrets GitHub optionnels (Settings → Secrets → Actions) :
#   KEYSTORE_BASE64    : keystore Release encodé en base64
#   KEYSTORE_PASSWORD  : mot de passe (store + clé)
#   KEYSTORE_ALIAS     : alias de la clé
#
# Sans ces secrets, le build fonctionne quand même (release signé clé debug).
# Le projet natif android/ est commité — aucun prebuild nécessaire en CI.
#
# ⚠️  Ce workflow est OPTIONNEL : le build de référence est 100 % LOCAL
#     (`npm run android:apk`, sans EAS ni cloud — voir MOBILE_BUILD.md).
#
# Note ABI : les builds CI ciblent arm64-v8a + armeabi-v7a (téléphones réels).
# C'est la moitié du travail natif → build ~2× plus rapide et beaucoup moins
# de mémoire. En local (`npm run android:debug`), les 4 ABI restent actives pour
# les émulateurs x86_64. Pour forcer toutes les ABI en CI, retirez le
# drapeau -PreactNativeArchitectures ci-dessous.

name: Android — APK & AAB

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: APK debug + release + AAB
    runs-on: ubuntu-24.04
    env:
      # Mémoire pour Metro/export:embed (bundling JS) — évite les OOM node
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package.json', 'mobile/bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Diagnostics
        working-directory: mobile/android
        run: |
          echo "── Java ──"
          java -version
          echo "── Node ──"
          node --version
          echo "── Bun ──"
          bun --version
          echo "── Android SDK ──"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || true
          echo "── Gradle (wrapper) ──"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Configurer la signature Release (secrets optionnels)
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Aucun secret keystore configuré — l'APK/AAB Release sera signé avec la clé debug." 
            exit 0
          fi
          # Chemin relatif à mobile/android/ (résolu par rootProject.file(...))
          echo "$KEYSTORE_BASE64" | base64 --decode > android/batibuild-release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "batibuild-release.keystore" "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" "$KEYSTORE_PASSWORD" \
            > android/keystore.properties

      - name: Build APK debug + APK release + AAB release
        working-directory: mobile/android
        run: |
          # La mémoire du daemon est définie dans android/gradle.properties.
          ./gradlew \
            assembleDebug assembleRelease bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Préparer les artefacts nommés
        run: |
          mkdir -p /tmp/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/dist/Batibuild-debug.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk /tmp/dist/Batibuild-release.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab /tmp/dist/Batibuild-release.aab
          ls -lh /tmp/dist

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-debug-apk
          path: /tmp/dist/Batibuild-debug.apk
          if-no-files-found: error

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-apk
          path: /tmp/dist/Batibuild-release.apk
          if-no-files-found: error

      - name: Upload AAB release
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-aab
          path: /tmp/dist/Batibuild-release.aab
          if-no-files-found: error
