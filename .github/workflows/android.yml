# BatiBuild Mobile — Build Android (APK debug + APK release + AAB release)
#
# Déclencheurs :
#   - push sur main (uniquement si mobile/ ou ce workflow change)
#   - workflow_dispatch (Actions → Run workflow)
#
# Artefacts téléchargeables après le run :
#   - Batibuild-debug.apk      (signé clé debug — tests rapides)
#   - Batibuild-release.apk    (signé clé Release si les secrets sont définis,
#                               sinon clé debug — installation manuelle)
#   - Batibuild-release.aab    (Google Play — nécessite la vraie clé Release)
#
# Secrets GitHub optionnels (Settings → Secrets → Actions) :
#   KEYSTORE_BASE64    : keystore Release encodé en base64
#   KEYSTORE_PASSWORD  : mot de passe (store + clé)
#   KEYSTORE_ALIAS     : alias de la clé
#
# Sans ces secrets, le build fonctionne quand même (release signé clé debug).
# Le projet natif android/ est commité — aucun prebuild nécessaire en CI.

name: Android — APK & AAB

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: APK debug + release + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Décoder le keystore Release (secrets optionnels)
        id: keystore
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/batibuild-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=batibuild-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build APK debug + APK release + AAB release
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Préparer les artefacts nommés
        run: |
          mkdir -p /tmp/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk /tmp/dist/Batibuild-debug.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk /tmp/dist/Batibuild-release.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab /tmp/dist/Batibuild-release.aab

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-debug-apk
          path: /tmp/dist/Batibuild-debug.apk
          if-no-files-found: error

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-apk
          path: /tmp/dist/Batibuild-release.apk
          if-no-files-found: error

      - name: Upload AAB release
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-aab
          path: /tmp/dist/Batibuild-release.aab
          if-no-files-found: error