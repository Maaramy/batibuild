# BatiBuild Mobile — Build Android 100 % autonome sur GitHub Actions
#
# Flux : git push origin main → runner ubuntu-latest → Node + JDK 17 + Android SDK
#        → npm/bun install → prebuild (si android/ absent) → Gradle
#        → Batibuild-debug.apk + Batibuild-release.apk + Batibuild-release.aab
#        → Artifacts du run.
#
# AUCUN outil Android n'est requis sur votre PC : ni JDK, ni Android SDK,
# ni Android Studio, ni Gradle. Tout est installé par le runner.
#
# Secrets GitHub FACULTATIFS (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64    keystore Release encodé en base64
#   KEYSTORE_PASSWORD  mot de passe (store + clé)
#   KEYSTORE_ALIAS     alias de la clé
# Sans eux, le build RÉUSSIT quand même : l'APK/AAB release est signé avec la
# clé debug (installable pour tester, refusé par Google Play). Aucun secret
# n'est jamais affiché dans les logs.
#
# La clé DEBUG (android/app/debug.keystore, alias `androiddebugkey`, mot de passe
# `android`) est versionnée dans le dépôt : ce n'est pas un secret de production.
# Une étape la régénère automatiquement si elle manque (scripts/ensure-debug-keystore.mjs),
# ce qui évite l'échec « :app:validateSigningDebug » sur un runner vierge.
#
# Ce workflow n'utilise PAS EAS et n'a besoin d'aucun EXPO_TOKEN.
#
# ── Diagnostic d'échec ──────────────────────────────────────────────────────
# Les tâches Gradle sont lancées via `mobile/scripts/ci-gradle.sh` : en cas
# d'échec, le script extrait la section « What went wrong » (la CAUSE RÉELLE),
# la liste des tâches en échec et les signatures connues (OOM, disque plein,
# ninja/CMake, erreur compilateur), et la publie dans le résumé du run.
# `--stacktrace` reste actif pour ne rien masquer.

name: Android — APK & AAB

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABI à compiler (arm64-v8a,armeabi-v7a = téléphones réels)"
        required: false
        default: "arm64-v8a,armeabi-v7a"
      force_prebuild:
        description: "Forcer « expo prebuild » (resynchroniser android/ depuis app.json)"
        type: boolean
        required: false
        default: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  # Mémoire du bundler JS (Metro / expo export:embed)
  NODE_OPTIONS: "--max-old-space-size=8192"
  # ABI ciblées : 2 ABI au lieu de 4 → build ~2× plus rapide et 2× moins de
  # mémoire (nécessaire sur un runner). Modifiable au lancement manuel.
  ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
  # Compilation C++ (CMake/ninja) : chaque processus clang++ consomme ~1,5 Go.
  # Le runner a 4 vCPU et ~16 Go ; sans limite, les 2 ABI compilées en parallèle
  # saturent la RAM et le noyau tue les compilateurs (« Killed »), ce qui se
  # traduit par un échec Gradle tardif et illisible. 2 = marge de sécurité.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-android:
    name: APK debug + APK release + AAB release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun (lockfile du projet)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (cmdline-tools + licences)
        uses: android-actions/setup-android@v3

      - name: Diagnostics — Java / Node / Android SDK / Gradle
        run: |
          echo "── Java ──"
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "── Node / npm / Bun ──"
          node --version
          npm --version
          bun --version
          echo "── Android SDK ──"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<non défini>}"
          sdkmanager --version
          adb --version
          echo "── Ressources du runner ──"
          nproc
          free -m
          df -h /
          echo "── Gradle (wrapper du projet, pas de Gradle global) ──"
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            android/gradlew --version
          else
            echo "android/gradlew absent — le projet natif sera généré par expo prebuild."
          fi

      - name: Install dependencies (lockfile auto-détecté)
        run: |
          if [ -f package-lock.json ]; then
            echo "→ package-lock.json détecté : npm ci"
            npm ci
          elif [ -f bun.lock ]; then
            echo "→ bun.lock détecté : bun install --frozen-lockfile"
            bun install --frozen-lockfile
          elif [ -f bun.lockb ]; then
            echo "→ bun.lockb détecté : bun install --frozen-lockfile"
            bun install --frozen-lockfile
          else
            echo "→ aucun lockfile : npm install"
            npm install
          fi

      - name: Typecheck (échec rapide avant le build lourd)
        run: npx tsc --noEmit

      - name: Projet natif Android (prebuild uniquement si nécessaire)
        run: |
          if [ "${{ inputs.force_prebuild }}" = "true" ] || [ ! -f android/app/build.gradle ]; then
            echo "→ « expo prebuild » : génération / resynchronisation de android/"
            npx expo prebuild --platform android --no-install
            node scripts/apply-signing.mjs
          else
            echo "✅ Projet natif android/ déjà présent dans le dépôt — prebuild inutile."
          fi
          chmod +x android/gradlew
          test -f android/app/build.gradle
          test -x android/gradlew
          echo "Projet natif prêt : $(grep -c '' android/app/build.gradle) lignes dans android/app/build.gradle"

      # ── CLÉ DE SIGNATURE DEBUG ─────────────────────────────────────────────
      # android/app/build.gradle déclare `signingConfigs.debug { storeFile
      # file('debug.keystore') }`. Sans ce fichier, Gradle échoue APRÈS la
      # compilation complète :
      #   Execution failed for task ':app:validateSigningDebug'.
      #   > Keystore file '.../android/app/debug.keystore' not found for signing config 'debug'.
      # La clé debug standard est versionnée dans le dépôt ; cette étape la
      # régénère si elle manque (clone vierge, android/ resynchronisé).
      # Ce n'est pas un secret de production (alias androiddebugkey / « android »).
      - name: Clé de signature debug (générée si absente)
        run: |
          echo "Checking Android debug signing configuration..."
          node scripts/ensure-debug-keystore.mjs
          ls -la android/app/debug.keystore

      - name: Installation des composants Android SDK du projet
        run: |
          CATALOG=node_modules/react-native/gradle/libs.versions.toml

          read_version() {
            # awk renvoie toujours 0 → pas de « || true » masquant une erreur.
            local key="$1" fallback="$2" value=""
            if [ -f "$CATALOG" ]; then
              value=$(awk -v k="$key" '$1==k { gsub(/\"/,"",$3); print $3; exit }' "$CATALOG")
            fi
            if [ -z "$value" ]; then value="$fallback"; fi
            printf '%s' "$value"
          }

          COMPILE_SDK=$(read_version compileSdk 36)
          TARGET_SDK=$(read_version targetSdk 36)
          BUILD_TOOLS=$(read_version buildTools 36.0.0)
          NDK_VERSION=$(read_version ndkVersion 27.1.12297006)
          # CMake 3.22.1 = version par défaut d'AGP 8.12 (utilisée par
          # expo-modules-core). Installé explicitement : évite tout
          # téléchargement automatique hasardeux en pleine compilation.
          CMAKE_VERSION=3.22.1
          echo "Versions lues dans le projet : compileSdk=$COMPILE_SDK targetSdk=$TARGET_SDK buildTools=$BUILD_TOOLS ndk=$NDK_VERSION cmake=$CMAKE_VERSION"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "── Libération d'espace disque (composants préinstallés inutiles) ──"
          df -h / | tail -1
          # Le runner embarque plusieurs NDK (≥ 2 Go chacun), les images
          # d'émulateur et les sources Android : plusieurs Go récupérables.
          if [ -d "$SDK/ndk" ]; then
            for d in "$SDK/ndk"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "$NDK_VERSION" ]; then
                echo "  - suppression ndk/$(basename "$d")"
                rm -rf "$d" || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          for old in system-images emulator sources skins; do
            if [ -e "$SDK/$old" ]; then
              echo "  - suppression $old/"
              rm -rf "$SDK/$old" || echo "    (non supprimable, ignoré)"
            fi
          done
          if [ -d "$SDK/platforms" ]; then
            for d in "$SDK/platforms"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "android-${COMPILE_SDK}" ]; then
                echo "  - suppression platforms/$(basename "$d")"
                rm -rf "$d" || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          if [ -d "$SDK/build-tools" ]; then
            for d in "$SDK/build-tools"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "$BUILD_TOOLS" ]; then
                echo "  - suppression build-tools/$(basename "$d")"
                rm -rf "$d" || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          df -h / | tail -1

          echo "── Acceptation des licences SDK ──"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1
          LICENSE_STATUS=${PIPESTATUS[1]:-0}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ] && [ "$LICENSE_STATUS" -ne 141 ]; then
            echo "❌ sdkmanager --licenses a échoué (code $LICENSE_STATUS)"
            exit 1
          fi
          echo "✅ Licences Android SDK acceptées"

          echo "── Installation des paquets requis ──"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

          {
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
          } >> "$GITHUB_ENV"

          echo "── Contenu du SDK ──"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/cmake"
          ls "$ANDROID_HOME/ndk"
          df -h / | tail -1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package.json', 'mobile/bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configurer la signature Release (secrets optionnels)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ℹ️  Aucun secret keystore configuré."
            echo "    → L'APK/AAB release sera signé avec la clé debug (tests uniquement)."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "❌ KEYSTORE_BASE64 est défini mais KEYSTORE_PASSWORD ou KEYSTORE_ALIAS manque."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/batibuild-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          # Vérification immédiate : évite une erreur de signature obscure 15 min plus tard.
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null 2>&1; then
            echo "❌ Keystore invalide : KEYSTORE_BASE64, KEYSTORE_PASSWORD ou KEYSTORE_ALIAS ne correspondent pas."
            exit 1
          fi
          echo "✅ Keystore décodé et validé (alias $KEYSTORE_ALIAS)."
          # Variables lues par android/app/build.gradle — rien n'est écrit dans le dépôt.
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "✅ Signature Release configurée (keystore externe, rien dans le dépôt)."

      # ── VÉRIFICATION DE LA SIGNATURE ───────────────────────────────────────
      # Échoue proprement (sans continue-on-error) si une config de signature
      # référence un fichier absent — détecté en quelques secondes au lieu de
      # 15 minutes de compilation. N'affiche aucun mot de passe.
      - name: Vérification de la signature (signingReport)
        run: bash scripts/ci-gradle.sh :app:signingReport signing

      # ── APK DEBUG ──────────────────────────────────────────────────────────
      # ci-gradle.sh affiche, en cas d'échec, la CAUSE RÉELLE du plantage.
      - name: Build — APK debug
        run: bash scripts/ci-gradle.sh :app:assembleDebug debug

      - name: Préparer l'APK debug
        run: |
          mkdir -p /tmp/dist
          DEBUG_APK=""
          if [ -d android/app/build/outputs/apk/debug ]; then
            DEBUG_APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -1)
          fi
          if [ -z "$DEBUG_APK" ]; then
            echo "❌ Aucun APK trouvé dans android/app/build/outputs/apk/debug/"
            exit 1
          fi
          cp "$DEBUG_APK" /tmp/dist/Batibuild-debug.apk
          ls -lh /tmp/dist/Batibuild-debug.apk
          # Preuve que l'APK est bien signé (aucun secret n'est affiché).
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$DEBUG_APK" | head -6

      - name: Upload — Batibuild-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-debug-apk
          path: /tmp/dist/Batibuild-debug.apk
          if-no-files-found: error

      # ── APK RELEASE ────────────────────────────────────────────────────────
      - name: Build — APK release
        run: bash scripts/ci-gradle.sh :app:assembleRelease release

      - name: Préparer l'APK release
        run: |
          mkdir -p /tmp/dist
          RELEASE_APK=""
          if [ -d android/app/build/outputs/apk/release ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "❌ Aucun APK trouvé dans android/app/build/outputs/apk/release/"
            exit 1
          fi
          cp "$RELEASE_APK" /tmp/dist/Batibuild-release.apk
          ls -lh /tmp/dist/Batibuild-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$RELEASE_APK" | head -6

      - name: Upload — Batibuild-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-apk
          path: /tmp/dist/Batibuild-release.apk
          if-no-files-found: error

      # ── AAB RELEASE (Google Play) ──────────────────────────────────────────
      - name: Build — AAB release
        run: bash scripts/ci-gradle.sh :app:bundleRelease aab

      - name: Préparer l'AAB release
        run: |
          mkdir -p /tmp/dist
          RELEASE_AAB=""
          if [ -d android/app/build/outputs/bundle/release ]; then
            RELEASE_AAB=$(find android/app/build/outputs/bundle/release -type f -name "*.aab" | head -1)
          fi
          if [ -z "$RELEASE_AAB" ]; then
            echo "❌ Aucun AAB trouvé dans android/app/build/outputs/bundle/release/"
            exit 1
          fi
          cp "$RELEASE_AAB" /tmp/dist/Batibuild-release.aab
          ls -lh /tmp/dist/Batibuild-release.aab

      - name: Upload — Batibuild-release.aab
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-aab
          path: /tmp/dist/Batibuild-release.aab
          if-no-files-found: error

      # ── DIAGNOSTIC VISIBLE EN CAS D'ÉCHEC ──────────────────────────────────
      # Ne masque rien : le job reste rouge. Affiche simplement la cause réelle
      # dans une étape dédiée, lisible même depuis le téléphone.
      - name: 🔍 Cause de l'échec (extrait des logs Gradle)
        if: failure()
        run: |
          FOUND=0
          for log in /tmp/gradle-*.log; do
            [ -f "$log" ] || continue
            FOUND=1
            echo "════════════════ $log ════════════════"
            sed -n '/What went wrong/,/^\* Try:/p' "$log" | head -60
            echo "──────────────── tâches en échec ────────────────"
            grep -E "^> Task .*FAILED" "$log" | head -5
            echo "──────────────── signatures connues ────────────────"
            grep -n -E "OutOfMemoryError|Java heap space|Killed|No space left on device|ninja: build stopped|CMake Error|e: file" "$log" | head -10
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "Aucun log Gradle disponible : l'échec est survenu avant la compilation."
          fi
          echo "── Ressources au moment de l'échec ──"
          free -m | head -2
          df -h / | tail -1

      - name: Résumé du build
        run: |
          echo "## ✅ Build Android terminé" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fichier | Taille |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/dist/*; do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ABI compilées : \`$ARCHITECTURES\`" >> "$GITHUB_STEP_SUMMARY"
          ls -lh /tmp/dist
