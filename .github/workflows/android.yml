# batibuild Mobile — Build Android 100 % autonome sur GitHub Actions
#
# Flux : git push origin main → runner ubuntu-latest → Node 22 + Bun + JDK 17
#        → setup-android@v4 (SDK + licences) → npm/bun install → prebuild
#        (si android/ absent) → composants SDK du projet → Gradle
#        → Batibuild-release.apk + Batibuild-release.aab (APK release, AAB release)
#        → GitHub Release (APK + AAB attachés) = COPIE DURABLE, hors quota
#          · tag `v*`            → Release portant ce tag ;
#          · lancement manuel    → `publish_release` (défaut **true**) ;
#          · push sur une branche → pré-version unique `v<version>-build<run>`.
#        → Nexus 3 si les secrets NEXUS_* existent (copie durable supplémentaire).
#        → artefact Actions de secours (7 jours, non bloquant).
#
# AUCUN outil Android n'est requis sur votre PC : ni JDK, ni Android SDK,
# ni Android Studio, ni Gradle. Tout est installé par le runner.
#
# Secrets GitHub FACULTATIFS (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64    keystore Release encodé en base64
#   KEYSTORE_PASSWORD  mot de passe (store + clé)
#   KEYSTORE_ALIAS     alias de la clé
# Sans eux, le build RÉUSSIT quand même : l'APK/AAB release est signé avec la
# clé debug (installable pour tester, refusé par Google Play). Aucun secret
# n'est jamais affiché dans les logs.
#
# La clé DEBUG (android/app/debug.keystore, alias `androiddebugkey`, mot de passe
# `android`) est versionnée dans le dépôt : ce n'est pas un secret de production.
# Une étape la régénère automatiquement si elle manque (scripts/ensure-debug-keystore.mjs),
# ce qui évite l'échec « :app:validateSigningDebug » sur un runner vierge.
#
# Ce workflow n'utilise PAS EAS et n'a besoin d'aucun EXPO_TOKEN.
#
# ── SDK Android : MÉTHODE UNIQUE ────────────────────────────────────────────
# Le SDK est installé par `android-actions/setup-android@v4` : c'est lui qui
# télécharge les cmdline-tools, accepte les licences lui-même
# (`accept-android-sdk-licenses: true`, sans journalisation) et installe
# `platform-tools`. Aucun cmdline-tools n'est téléchargé à la main et AUCUNE
# commande `sdkmanager --licenses` n'est exécutée par le workflow.
#
# L'ancien SDK préinstallé de l'image du runner (cmdline-tools 12.0 dans
# `cmdline-tools/latest`) est supprimé et retiré du PATH AVANT l'appel à
# l'action : c'est ce conflit qui provoquait « Wrong version in preinstalled
# sdkmanager » puis l'échec de l'acceptation des licences (« Fetch remote
# repository »). Après l'action, PATH et ANDROID_SDK_ROOT / ANDROID_HOME sont
# normalisés puis vérifiés : un SEUL sdkmanager reste résoluble, et il
# appartient au SDK configuré.
#
# Les composants exigés par le projet (plateforme, build-tools, NDK, CMake)
# sont lus dans le catalogue React Native du projet
# (`mobile/node_modules/react-native/gradle/libs.versions.toml`) : aucune
# version n'est imposée en dur, la configuration Android existante est suivie.
#
# ── Diagnostic d'échec ──────────────────────────────────────────────────────
# Les tâches Gradle sont lancées via `mobile/scripts/ci-gradle.sh` : en cas
# d'échec, le script extrait la section « What went wrong » (la CAUSE RÉELLE),
# la liste des tâches en échec et les signatures connues (OOM, disque plein,
# ninja/CMake, erreur compilateur), et la publie dans le résumé du run.
# `--stacktrace` reste actif pour ne rien masquer.
#
# ── STOCKAGE DES ARTEFACTS : GITHUB RELEASE (principale) + NEXUS 3
#
#  1. SEULS l'APK release et l'AAB release sont produits et publiés — JAMAIS
#      l'APK debug (inutile en production, premier consommateur d'espace).
#  2. GITHUB RELEASE = COPIE DURABLE PAR DÉFAUT, sans secret à configurer :
#      · tag `v*`                  → Release portant ce tag ;
#      · lancement manuel          → `publish_release` (défaut `true`) ;
#      · push sur une branche      → pré-version `v<version>-build<run>` ;
#      les 2 fichiers y sont attachés puis VÉRIFIÉS via l'API GitHub.
#  3. NEXUS 3 (facultatif) : si NEXUS_HOST_URL / NEXUS_USER / NEXUS_TOKEN
#      existent, les mêmes fichiers partent en UN SEUL upload RAW via
#      `astertom/nexus-upload-artifact@v1`. Copie durable supplémentaire.
#  4. GARDE-FOU FINAL exécuté APRÈS la publication : il n'accepte que des
#      faits (Release contenant réellement les 2 fichiers, ou upload Nexus
#      réussi). Une Release réussie suffit → plus besoin des secrets Nexus.
#      Sans aucune copie durable, le job échoue avec la cause exacte.
#  5. ARTEFACT ACTIONS DE SECOURS : envoyé en complément, rétention 5 jours,
#      `continue-on-error: true` — un quota d'artefacts saturé ne casse rien.
#  6. Job « cleanup-artifacts » AVANT le build : purge via l'API GitHub
#      (`actions: write`, moindre privilège) les artefacts résiduels laissés
#      par les anciens runs — jamais les sources, le code, l'historique Git ni
#      les Releases. `continue-on-error: true` : il ne bloque jamais le build.
#
# Secrets GitHub FACULTATIFS pour la publication Nexus (Settings → Secrets and
# variables → Actions) :
#   NEXUS_HOST_URL  URL du Nexus 3 RM (ex. https://nexus.exemple.tn)
#   NEXUS_USER      utilisateur Nexus 3
#   NEXUS_TOKEN     mot de passe de l'utilisateur Nexus 3
# Variables de dépôt FACULTATIVES (même écran, onglet « Variables ») :
#   NEXUS_REPOSITORIES  dépôts RAW, séparés par des virgules — défaut « raw »
#   NEXUS_PATH          chemin de stockage dans le dépôt RAW — défaut /batibuild/
# Sans les secrets NEXUS_*, l'étape Nexus est ignorée : la GitHub Release
# assure alors la copie durable (garde-fou : jamais de build silencieusement
# perdu).
#
# ── ACTIONS (runtime Node 24) ───────────────────────────────────────────────
# Node.js 20 a été retiré des runners GitHub le 16/09/2026 : toutes les actions
# tournent désormais sur Node 24 (checkout v5, setup-node v5, setup-java v5,
# cache v6, setup-android v4, setup-bun v2, upload-artifact v7).
# L'upload principal des APK/AAB passe par la CLI `gh` officielle (GitHub
# Releases) et, si configuré, par `astertom/nexus-upload-artifact@v1` (action
# DOCKER : le runner ubuntu-latest fournit Docker).

name: Android — APK & AAB

on:
  # `branches` + `paths` : build automatique dès qu'un fichier de mobile/ change
  # sur main.
  # `tags: ["v*"]` : publication d'une Release versionnée. Les filtres `paths` ne
  # sont PAS évalués pour les poussées de tags (documentation GitHub) : un tag
  # `v*` déclenche donc toujours le build, même s'il ne touche pas mobile/.
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABI à compiler (arm64-v8a,armeabi-v7a = téléphones réels)"
        required: false
        default: "arm64-v8a,armeabi-v7a"
      force_prebuild:
        description: "Forcer « expo prebuild » (resynchroniser android/ depuis app.json)"
        type: boolean
        required: false
        default: false
      retention_days:
        description: "Nettoyage GitHub : âge maximal (jours) des artefacts résiduels à purger. Vide = 1 j"
        required: false
        default: ""
      publish_release:
        description: "Publier une GitHub Release (APK + AAB attachés) — tag v<version>-build<run>"
        type: boolean
        required: false
        # DÉFAUT TRUE : un lancement manuel doit TOUJOURS produire une copie
        # durable (GitHub Release). Laisser ce champ à false sans secrets Nexus
        # faisait échouer le run sur « Aucune copie durable du build ».
        default: true
      cleanup_scope:
        description: "Nettoyage : « all » (tout le dépôt) ou « workflow » (batibuild uniquement)"
        required: false
        default: "all"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Permissions par défaut : LECTURE seule. La permission `actions: write`
# (nécessaire pour supprimer les anciens artefacts) n'est accordée qu'au job
# « cleanup-artifacts » — moindre privilège.
permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  # Mémoire du bundler JS (Metro / expo export:embed)
  NODE_OPTIONS: "--max-old-space-size=8192"
  # ABI ciblées : 2 ABI au lieu de 4 → build ~2× plus rapide et 2× moins de
  # mémoire (nécessaire sur un runner). Modifiable au lancement manuel.
  ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
  # Compilation C++ (CMake/ninja) : chaque processus clang++ consomme ~1,5 Go.
  # Le runner a 4 vCPU et ~16 Go ; sans limite, les 2 ABI compilées en parallèle
  # saturent la RAM et le noyau tue les compilateurs (« Killed »), ce qui se
  # traduit par un échec Gradle tardif et illisible. 2 = marge de sécurité.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

  # ── NETTOYAGE DES ARTEFACTS GITHUB RÉSIDUELS ──────────────────────────────
  # Le workflow ne crée PLUS d'artefact GitHub (upload Nexus 3) : ces variables
  # ne servent plus qu'au job « cleanup-artifacts », qui purge les artefacts
  # laissés par les anciens runs (aucun impact sur le build).
  # ARTIFACT_RETENTION_DAYS : âge maximal (jours) avant suppression. Vide = 1 j.
  # ARTIFACT_CLEANUP_SCOPE  : `all` = tous les artefacts du dépôt (seuls les
  #                           temporaires périmés sont supprimés) ;
  #                           `workflow` = uniquement les artefacts batibuild.
  # ARTIFACT_KEEP_LATEST    : nombre de builds batibuild conservés (1).
  ARTIFACT_RETENTION_DAYS: ${{ inputs.retention_days }}
  # PUBLISH_RELEASE : intention de publication, décidée dans l'étape `dist`.
  #   · lancement manuel → valeur du champ `publish_release` (défaut true) ;
  #   · push d'un tag `v*` → ce tag, quoi qu'il arrive ;
  #   · push sur une branche → aucune saisie : la valeur retenue est `true`,
  #     afin que CHAQUE build réussi obtienne une copie durable (pré-version
  #     unique) et que le garde-fou final ne rende jamais le workflow rouge
  #     faute de secrets Nexus.
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  ARTIFACT_CLEANUP_SCOPE: ${{ inputs.cleanup_scope || 'all' }}
  ARTIFACT_KEEP_LATEST: "1"

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 — NETTOYAGE DES ANCIENS ARTEFACTS (exécuté AVANT le build)
  #
  # C'est la correction de fond du quota saturé : le stockage d'artefacts est
  # partagé par TOUS les runs, donc les anciens APK/AAB empêchent la publication
  # du nouveau. Ce job supprime via l'API GitHub :
  #   · les artefacts expirés ;
  #   · les artefacts du dépôt plus vieux que ARTIFACT_RETENTION_DAYS ;
  #   · les anciennes générations batibuild, en conservant la plus récente — le
  #     build précédent reste donc téléchargeable pendant sa rétention.
  # JAMAIS supprimés : sources, code, historique Git, releases GitHub, artefacts
  # du run en cours (identifiés par GITHUB_RUN_ID).
  #
  # `continue-on-error: true` : si le jeton ne peut pas supprimer (politique du
  # dépôt, permission bloquée), le nettoyage écrit la cause exacte et la marche à
  # suivre dans le résumé, mais ne bloque jamais la compilation.
  # ══════════════════════════════════════════════════════════════════════════
  cleanup-artifacts:
    name: Nettoyage des artefacts (quota)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout (script de nettoyage uniquement)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Supprimer les anciens artefacts temporaires (API GitHub)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/artifact-storage.mjs cleanup

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 — BUILD ANDROID : APK release + AAB release (jamais l'APK debug)
  # ══════════════════════════════════════════════════════════════════════════
  build-android:
    name: APK release + AAB release
    runs-on: ubuntu-latest
    needs: [cleanup-artifacts]
    # Le nettoyage ne doit JAMAIS empêcher le build de tourner.
    if: ${{ !cancelled() }}
    permissions:
      # `contents: write` : nécessaire UNIQUEMENT pour publier la GitHub Release
      # (attacher les APK/AAB, et créer le tag lors d'un lancement manuel). Les
      # permissions GitHub Actions sont déclarées PAR JOB et non par étape : ce
      # job porte donc la permission, mais aucune étape ne l'exerce avant la
      # publication — et la Release n'est publiée que sur un tag `v*` ou sur
      # demande explicite, jamais sur un simple push de branche.
      contents: write
    # Identifiants Nexus 3 RM déclarés au niveau du job : le contexte `secrets`
    # n'est pas autorisé dans un `if:`, mais `env` l'est — l'étape Nexus peut
    # donc être franchement SAUTÉE (avec message clair) si les secrets manquent.
    env:
      NEXUS_HOST_URL: ${{ secrets.NEXUS_HOST_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
      NEXUS_REPOSITORIES: ${{ vars.NEXUS_REPOSITORIES || 'raw' }}
      NEXUS_PATH: ${{ vars.NEXUS_PATH || '/batibuild/' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun (lockfile du projet)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ── SDK ANDROID — MÉTHODE UNIQUE (`MOBILE_BUILD.md` § Dépannage) ───────
      # L'ancien sdkmanager préinstallé est supprimé AVANT setup-android@v4,
      # sinon « Wrong version in preinstalled sdkmanager » puis échec des
      # licences. Aucun cmdline-tools n'est installé à la main et aucune commande
      # `sdkmanager --licenses` n'est exécutée : l'action s'en charge.

      - name: Préparer l'emplacement du SDK Android (supprimer l'ancien sdkmanager)
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_SDK="/usr/local/lib/android/sdk"
          SDK_ROOT="$IMAGE_SDK"

          # SDK de l'image non inscriptible (ou absent) → SDK propre au runner.
          # L'ancien SDK n'est alors plus utilisé : on récupère son espace disque.
          if [ ! -d "$SDK_ROOT" ] || [ ! -w "$SDK_ROOT" ]; then
            SDK_ROOT="${RUNNER_TEMP}/android-sdk"
            echo "ℹ️  SDK de l'image absent ou non inscriptible → SDK du build : $SDK_ROOT"
            if [ -d "$IMAGE_SDK" ]; then
              sudo rm -rf "$IMAGE_SDK" 2>/dev/null \
                || rm -rf "$IMAGE_SDK" 2>/dev/null \
                || echo "⚠️  ancien SDK non supprimable (ignoré : optimisation d'espace disque uniquement)"
            fi
          fi
          mkdir -p "$SDK_ROOT"

          # Ancien sdkmanager préinstallé (cmdline-tools 12.0 / 16.0) : SUPPRIMÉ
          # pour qu'il ne puisse plus être résolu par PATH ni entrer en conflit
          # avec celui que setup-android@v4 installe dans cmdline-tools/<version>.
          if [ -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Suppression de l'ancien sdkmanager préinstallé : $SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null \
              || sudo rm -rf "$SDK_ROOT/cmdline-tools/latest"
          fi

          # PATH nettoyé : plus aucun chemin d'un SDK Android préinstallé.
          # (L'action ajoutera ensuite SES dossiers en tête de PATH.)
          CLEAN_PATH=""
          IFS=':' read -r -a ENTRIES <<< "$PATH"
          for entry in "${ENTRIES[@]}"; do
            [ -n "$entry" ] || continue
            case "$entry" in
              */cmdline-tools/*) continue ;;
              "$IMAGE_SDK" | "$IMAGE_SDK"/*) continue ;;
              /usr/lib/android-sdk | /usr/lib/android-sdk/*) continue ;;
              /opt/android* | /opt/android*/*) continue ;;
            esac
            CLEAN_PATH="${CLEAN_PATH:+$CLEAN_PATH:}$entry"
          done

          # Variables officielles : identiques pour TOUTES les étapes suivantes.
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          # Une seule ligne → ajoutée en tête de PATH pour les étapes suivantes.
          echo "$CLEAN_PATH" >> "$GITHUB_PATH"

          echo "✅ Emplacement du SDK Android : $SDK_ROOT"
          echo "   cmdline-tools présents : $(ls "$SDK_ROOT/cmdline-tools" 2>/dev/null || echo 'aucun — installés par setup-android')"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Vérifier le SDK Android et normaliser PATH
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "❌ ANDROID_SDK_ROOT / ANDROID_HOME non défini par setup-android."
            exit 1
          fi

          # Un SEUL sdkmanager, et il doit appartenir au SDK configuré.
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "❌ sdkmanager introuvable dans le PATH."
            exit 1
          fi
          case "$SDK_MANAGER" in
            "$SDK_ROOT"/*) ;;
            *)
              echo "❌ sdkmanager résolu HORS du SDK configuré : $SDK_MANAGER (SDK_ROOT=$SDK_ROOT)"
              exit 1
              ;;
          esac
          TOOLS_DIR="$(dirname "$SDK_MANAGER")"

          # PATH final : outils du SDK de l'action en tête, aucun chemin d'un SDK
          # préinstallé, et plus aucun dossier cmdline-tools concurrent.
          CLEAN_PATH="$TOOLS_DIR:$SDK_ROOT/platform-tools"
          IFS=':' read -r -a ENTRIES <<< "$PATH"
          for entry in "${ENTRIES[@]}"; do
            [ -n "$entry" ] || continue
            case "$entry" in
              "$TOOLS_DIR" | "$SDK_ROOT/platform-tools") continue ;;
              */cmdline-tools/*) continue ;;
              /usr/local/lib/android/sdk | /usr/local/lib/android/sdk/*) continue ;;
              /usr/lib/android-sdk | /usr/lib/android-sdk/*) continue ;;
              /opt/android* | /opt/android*/*) continue ;;
            esac
            CLEAN_PATH="$CLEAN_PATH:$entry"
          done

          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$CLEAN_PATH" >> "$GITHUB_PATH"

          echo "✅ ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "✅ ANDROID_HOME=$SDK_ROOT"
          echo "✅ sdkmanager résolu : $SDK_MANAGER"
          echo "✅ sdkmanager --version : $(sdkmanager --version)"

      - name: Install dependencies (lockfile auto-détecté)
        run: |
          if [ -f package-lock.json ]; then
            echo "→ package-lock.json détecté : npm ci"
            npm ci
          elif [ -f bun.lock ]; then
            echo "→ bun.lock détecté : bun install --frozen-lockfile"
            bun install --frozen-lockfile
          elif [ -f bun.lockb ]; then
            echo "→ bun.lockb détecté : bun install --frozen-lockfile"
            bun install --frozen-lockfile
          else
            echo "→ aucun lockfile : npm install"
            npm install
          fi

      - name: Typecheck (échec rapide avant le build lourd)
        run: npx tsc --noEmit

      - name: Projet natif Android (prebuild uniquement si nécessaire)
        run: |
          if [ "${{ inputs.force_prebuild }}" = "true" ] || [ ! -f android/app/build.gradle ]; then
            echo "→ « expo prebuild » : génération / resynchronisation de android/"
            npx expo prebuild --platform android --no-install
            node scripts/apply-signing.mjs
          else
            echo "✅ Projet natif android/ déjà présent dans le dépôt — prebuild inutile."
          fi
          chmod +x android/gradlew
          test -f android/app/build.gradle
          test -x android/gradlew
          echo "Projet natif prêt : $(grep -c '' android/app/build.gradle) lignes dans android/app/build.gradle"

      # ── CLÉ DE SIGNATURE DEBUG ─────────────────────────────────────────────
      # android/app/build.gradle déclare `signingConfigs.debug { storeFile
      # file('debug.keystore') }`. Sans ce fichier, Gradle échoue APRÈS la
      # compilation complète :
      #   Execution failed for task ':app:validateSigningDebug'.
      #   > Keystore file '.../android/app/debug.keystore' not found for signing config 'debug'.
      # La clé debug standard est versionnée dans le dépôt ; cette étape la
      # régénère si elle manque (clone vierge, android/ resynchronisé).
      # Ce n'est pas un secret de production (alias androiddebugkey / « android »).
      - name: Clé de signature debug (générée si absente)
        run: |
          echo "Checking Android debug signing configuration..."
          node scripts/ensure-debug-keystore.mjs
          ls -la android/app/debug.keystore

      # ── PRÉ-VÉRIFICATIONS MOBILES (avant le build lourd) ──────────────────
      # Dépendances, config Android, routes de la plateforme, contrat
      # WebView ↔ natif, assets/icônes, workflow CI : tout échoue en quelques
      # secondes au lieu d'après 15 min de compilation.
      - name: Pré-vérifications mobiles (routes, config, assets, contrat natif)
        env:
          SKIP_TYPECHECK: "1"
        run: node scripts/preflight-android.mjs --repair

      # ── COMPOSANTS ANDROID SDK RÉELLEMENT NÉCESSAIRES AU PROJET ────────────
      # Versions AUTO-DÉTECTÉES dans le catalogue du projet
      # (`node_modules/react-native/gradle/libs.versions.toml`, avec repli sur
      # les versions actuelles de React Native) : aucune version n'est imposée
      # en dur, la plateforme et les build-tools suivent la configuration
      # Android EXISTANTE du projet (compileSdk 36 aujourd'hui).
      #
      # Les licences SDK sont acceptées par setup-android@v4 lui-même : plus
      # aucun `sdkmanager --licenses` ici.
      - name: Installation des composants Android SDK du projet
        shell: bash
        run: |
          set -euo pipefail

          CATALOG=node_modules/react-native/gradle/libs.versions.toml

          read_version() {
            # awk renvoie toujours 0 → pas de « || true » masquant une erreur.
            local key="$1" fallback="$2" value=""
            if [ -f "$CATALOG" ]; then
              value=$(awk -v k="$key" '$1==k { gsub(/\"/,"",$3); print $3; exit }' "$CATALOG")
            fi
            if [ -z "$value" ]; then value="$fallback"; fi
            printf '%s' "$value"
          }

          COMPILE_SDK=$(read_version compileSdk 36)
          TARGET_SDK=$(read_version targetSdk 36)
          BUILD_TOOLS=$(read_version buildTools 36.0.0)
          NDK_VERSION=$(read_version ndkVersion 27.1.12297006)
          # CMake 3.22.1 = version par défaut d'AGP 8.12 (utilisée par
          # expo-modules-core). Installé explicitement : évite tout
          # téléchargement automatique hasardeux en pleine compilation.
          CMAKE_VERSION=3.22.1
          echo "Versions lues dans le projet : compileSdk=$COMPILE_SDK targetSdk=$TARGET_SDK buildTools=$BUILD_TOOLS ndk=$NDK_VERSION cmake=$CMAKE_VERSION"

          # UN SEUL SDK : celui configuré par setup-android@v4 (puis normalisé par
          # l'étape « Vérifier le SDK Android et normaliser PATH »). L'ancien SDK
          # préinstallé de l'image n'est jamais utilisé.
          SDK_ROOT="${ANDROID_SDK_ROOT:?SDK Android non configuré — étape « Setup Android SDK » manquante}"
          test -d "$SDK_ROOT"

          echo "── Libération d'espace disque (composants préinstallés inutiles) ──"
          df -h / | tail -1
          # Le runner embarque plusieurs NDK (≥ 2 Go chacun), les images
          # d'émulateur et les sources Android : plusieurs Go récupérables.
          if [ -d "$SDK_ROOT/ndk" ]; then
            for d in "$SDK_ROOT/ndk"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "$NDK_VERSION" ]; then
                echo "  - suppression ndk/$(basename "$d")"
                rm -rf "$d" 2>/dev/null || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          for obsolete in system-images emulator sources skins; do
            if [ -e "$SDK_ROOT/$obsolete" ]; then
              echo "  - suppression $obsolete/"
              rm -rf "$SDK_ROOT/$obsolete" 2>/dev/null || echo "    (non supprimable, ignoré)"
            fi
          done
          if [ -d "$SDK_ROOT/platforms" ]; then
            for d in "$SDK_ROOT/platforms"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "android-${COMPILE_SDK}" ]; then
                echo "  - suppression platforms/$(basename "$d")"
                rm -rf "$d" 2>/dev/null || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          if [ -d "$SDK_ROOT/build-tools" ]; then
            for d in "$SDK_ROOT/build-tools"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "$BUILD_TOOLS" ]; then
                echo "  - suppression build-tools/$(basename "$d")"
                rm -rf "$d" 2>/dev/null || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          df -h / | tail -1

          # LICENCES : elles sont acceptées par setup-android@v4
          # (`accept-android-sdk-licenses: true`, journalisation désactivée).
          # AUCUN `sdkmanager --licenses` n'est exécuté ici : cet appel manuel
          # résolvait l'ancien sdkmanager préinstallé et provoquait l'échec
          # « Fetch remote repository ».
          test -d "$SDK_ROOT/licenses"
          test -n "$(ls -A "$SDK_ROOT/licenses")"
          echo "Licences acceptées : $(ls "$SDK_ROOT/licenses" | tr '\n' ' ')"

          echo "── Installation des paquets requis (sdkmanager du SDK configuré) ──"
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

          # Vérification réelle : les composants EXIGÉS par le projet sont bien
          # installés dans le SDK configuré (aucun contournement si absent).
          test -d "$SDK_ROOT/platforms/android-${COMPILE_SDK}"
          test -d "$SDK_ROOT/build-tools/${BUILD_TOOLS}"
          test -d "$SDK_ROOT/ndk/${NDK_VERSION}"
          test -d "$SDK_ROOT/cmake/${CMAKE_VERSION}"

          echo "── Contenu du SDK : $SDK_ROOT ──"
          ls "$SDK_ROOT"
          ls "$SDK_ROOT/platforms"
          ls "$SDK_ROOT/build-tools"
          ls "$SDK_ROOT/cmake"
          ls "$SDK_ROOT/ndk"
          df -h / | tail -1

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package.json', 'mobile/bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ══════════════════════════════════════════════════════════════════════
      # VÉRIFICATION AVANT BUILD — Java, SDK, adb, chemins
      # Échoue immédiatement (4 secondes) si un outil manque, si le SDK n'est
      # pas celui configuré, ou si un ancien sdkmanager préinstallé était
      # redevenu prioritaire dans PATH.
      # ══════════════════════════════════════════════════════════════════════
      - name: Vérification avant build (Java, Android SDK, adb, PATH)
        shell: bash
        run: |
          set -euo pipefail

          echo "── Java (JDK 17 Temurin) ──"
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

          echo "── Node / npm / Bun ──"
          node --version
          npm --version
          bun --version

          echo "── Android SDK ──"
          sdkmanager --version
          adb version
          echo "$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"

          echo "── Outils réellement résolus par PATH ──"
          SDK_MANAGER="$(command -v sdkmanager)"
          ADB="$(command -v adb)"
          echo "sdkmanager → $SDK_MANAGER"
          echo "adb        → $ADB"
          case "$SDK_MANAGER" in
            "$ANDROID_SDK_ROOT"/*) echo "✅ sdkmanager appartient au SDK configuré" ;;
            *)
              echo "❌ sdkmanager résolu hors du SDK configuré ($ANDROID_SDK_ROOT)."
              exit 1
              ;;
          esac
          case "$ADB" in
            "$ANDROID_SDK_ROOT"/*) echo "✅ adb appartient au SDK configuré" ;;
            *)
              echo "❌ adb résolu hors du SDK configuré ($ANDROID_SDK_ROOT)."
              exit 1
              ;;
          esac
          if [ "${ANDROID_HOME:-}" != "$ANDROID_SDK_ROOT" ]; then
            echo "❌ ANDROID_HOME ($ANDROID_HOME) ≠ ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)"
            exit 1
          fi
          echo "✅ ANDROID_HOME = ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"

          echo "── Ressources du runner ──"
          nproc
          free -m
          df -h /

          echo "── Gradle (wrapper du projet, aucun Gradle global) ──"
          test -x android/gradlew
          android/gradlew --version

      - name: Configurer la signature Release (secrets optionnels)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  Aucun secret keystore configuré (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_ALIAS)."
            echo "    → L'APK/AAB release sera signé avec la clé DEBUG Android versionnée dans le dépôt."
            echo "    → Cet APK s'installe sur un téléphone vierge, mais il ne peut PAS remplacer"
            echo "      une application signée avec une autre clé (Android répond alors :"
            echo "      « L'application n'a pas été installée, car le package semble ne pas être valide »)"
            echo "      et Google Play le refuse. Configurez le keystore de production pour publier :"
            echo "      voir MOBILE_BUILD.md §11 (npm run keystore:generate, puis les 3 secrets)."
            echo "PRODUCTION_SIGNING=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "❌ KEYSTORE_BASE64 est défini mais KEYSTORE_PASSWORD ou KEYSTORE_ALIAS manque."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/batibuild-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          # Vérification immédiate : évite une erreur de signature obscure 15 min plus tard.
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null 2>&1; then
            echo "❌ Keystore invalide : KEYSTORE_BASE64, KEYSTORE_PASSWORD ou KEYSTORE_ALIAS ne correspondent pas."
            exit 1
          fi
          echo "✅ Keystore décodé et validé (alias $KEYSTORE_ALIAS)."

          # Empreinte du certificat de production. Elle doit rester IDENTIQUE
          # d'une version à l'autre : Android refuse la mise à jour d'une
          # application dont la signature a changé. Elle est donc vérifiée sur
          # l'APK produit, puis affichée dans le résumé du run.
          CERT_SHA256=$(keytool -list -v -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" \
            | sed -nE 's/.*SHA-?256: //p' | head -1 | tr -d ' \r')
          if [ -z "$CERT_SHA256" ]; then
            echo "❌ Impossible de lire l'empreinte SHA-256 du certificat du keystore."
            exit 1
          fi
          echo "🔐 Certificat de production : SHA-256 $CERT_SHA256"

          # Variables lues par android/app/build.gradle — rien n'est écrit dans le dépôt.
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "EXPECTED_CERT_SHA256=$CERT_SHA256"
            echo "PRODUCTION_SIGNING=true"
          } >> "$GITHUB_ENV"
          echo "✅ Signature Release configurée (keystore externe, rien dans le dépôt)."

      # ── VÉRIFICATION DE LA SIGNATURE ───────────────────────────────────────
      # Échoue proprement (sans continue-on-error) si une config de signature
      # référence un fichier absent — détecté en quelques secondes au lieu de
      # 15 minutes de compilation. N'affiche aucun mot de passe.
      - name: Vérification de la signature (signingReport)
        run: bash scripts/ci-gradle.sh :app:signingReport signing

      # ── IDENTIFICATION, RÉTENTION ET PUBLICATION (Release GitHub) ────────────
      # Le libellé ci-dessous (batibuild 1.3.2, versionCode 12, run 123) ne sert
      # qu'aux logs et au résumé : l'artefact lui-même porte le nom fixe et propre
      # « batibuild-release » (APK release + AAB release).
      #
      # C'est ici qu'est décidée la publication en GitHub Release :
      #   · push d'un tag `v*`                        → Release portant ce tag ;
      #   · lancement manuel + `publish_release: true` → Release pré-versionnée
      #     `v<version>-build<run>` (le tag est créé sur le commit lancé) ;
      #   · tout le reste (push sur main)              → aucune Release.
      - name: Identifier le build (nom, rétention, publication)
        id: dist
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          LABEL="batibuild-v${VERSION}-code${CODE}-run${GITHUB_RUN_NUMBER}"

          # ── Faut-il publier une Release ? ──────────────────────────────────
          # Défaut TRUE : sans saisie (push sur une branche), le build est
          # publié en pré-version pour ne jamais être perdu. Un lancement
          # manuel transmet explicitement `publish_release` (défaut true) ;
          # seul un choix explicite « false » désactive la publication.
          PUBLISH_INPUT="${PUBLISH_RELEASE:-true}"
          PUBLISH="false"
          TAG=""
          PRERELEASE="false"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PUBLISH="true"
            # v1.4.0-rc1, v1.4.0-beta.2… : jamais proposée comme « dernière
            # version » tant que le tag porte un suffixe de pré-version.
            case "$TAG" in
              *-*) PRERELEASE="true" ;;
            esac
          fi
          if [ "$PUBLISH_INPUT" = "true" ]; then
            PUBLISH="true"
            if [ -z "$TAG" ]; then
              # Aucun tag fourni (push de branche / lancement manuel) : tag
              # unique par run, marqué pré-version. Un tag `v*` réel n'est
              # JAMAIS transformé en pré-version par ce bloc.
              TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
              PRERELEASE="true"
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "code=${CODE}"
            echo "label=${LABEL}"
            echo "release=${PUBLISH}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Build                : ${LABEL}"
          if [ -n "${NEXUS_HOST_URL:-}" ]; then
            echo "Nexus 3              : dépôt(s) ${NEXUS_REPOSITORIES:-raw}, chemin ${NEXUS_PATH:-/batibuild/}"
          else
            echo "Nexus 3              : non configuré (secrets NEXUS_HOST_URL / NEXUS_USER / NEXUS_TOKEN absents)"
          fi
          if [ "$PUBLISH" = "true" ]; then
            echo "Release GitHub       : ${TAG} (pré-version : ${PRERELEASE})"
          else
            echo "Release GitHub       : aucune (« publish_release » = false) — seule une copie Nexus peut conserver ce build"
          fi
          echo "Nettoyage            : portée ${ARTIFACT_CLEANUP_SCOPE}, ${ARTIFACT_KEEP_LATEST} build(s) conservé(s)"

      # ── APK DEBUG : VOLONTAIREMENT NON PRODUIT ─────────────────────────────
      # L'APK debug n'est ni nécessaire à la production ni publié : il ne ferait
      # que gonfler le stockage d'artefacts. Seuls l'APK release et l'AAB release
      # sont compilés, vérifiés et publiés ci-dessous (le build release reste
      # signé par la clé debug quand aucun secret keystore n'est fourni).

      # ── APK RELEASE ────────────────────────────────────────────────────────
      - name: Build — APK release
        run: bash scripts/ci-gradle.sh :app:assembleRelease release

      # ══════════════════════════════════════════════════════════════════════
      # CONTRÔLES BLOQUANTS DE L'APK (aucune publication si un contrôle échoue)
      #
      # L'ancienne version faisait `apksigner verify … | head -6` : le code de
      # sortie d'apksigner était PERDU (celui de `head` valait 0), et un APK
      # mal signé pouvait donc être publié. Ici :
      #   · un seul APK produit (universel — pas de split ABI ambigu) ;
      #   · refus d'un fichier « *-unsigned.apk » (Gradle sans signingConfig) ;
      #   · alignement vérifié (zipalign -c -p 4) ;
      #   · signature vérifiée avec capture du code retour (v1 ET v2 exigés) ;
      #   · empreinte du certificat comparée au keystore de production.
      # ══════════════════════════════════════════════════════════════════════
      - name: Préparer et valider l'APK release (apksigner + zipalign)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          OUT="android/app/build/outputs/apk/release"
          if [ ! -d "$OUT" ]; then
            echo "❌ $OUT est absent : Gradle n'a produit aucun APK release."
            exit 1
          fi
          mapfile -t APKS < <(find "$OUT" -maxdepth 1 -type f -name "*.apk" | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "❌ Aucun APK dans $OUT."
            exit 1
          fi
          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "❌ Plusieurs APK release produits (splits ABI ?) :"
            printf '   %s\n' "${APKS[@]}"
            echo "   Un APK UNIVERSEL est requis pour l'installation directe."
            exit 1
          fi
          RELEASE_APK="${APKS[0]}"
          case "$RELEASE_APK" in
            *-unsigned.apk)
              echo "❌ L'APK produit est NON SIGNÉ ($RELEASE_APK) : signingConfig absent."
              exit 1
              ;;
          esac
          cp "$RELEASE_APK" /tmp/dist/Batibuild-release.apk
          ls -l /tmp/dist/Batibuild-release.apk

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          # 1) Alignement : obligatoire avec extractNativeLibs=false.
          if ! "$ZIPALIGN" -c -p 4 /tmp/dist/Batibuild-release.apk; then
            echo "❌ APK mal aligné (zipalign -c -p 4) : Android peut refuser l'installation."
            exit 1
          fi
          echo "✅ Alignement 4 Ko vérifié (zipalign)."

          # 2) Signature : le code retour est CAPTURÉ (aucun pipe ne le masque).
          if ! "$APKSIGNER" verify --verbose --print-certs /tmp/dist/Batibuild-release.apk > /tmp/apksigner.txt 2>&1; then
            echo "❌ apksigner verify a échoué :"
            cat /tmp/apksigner.txt
            exit 1
          fi
          cat /tmp/apksigner.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apksigner.txt || {
            echo "❌ Signature v1 (JAR) absente : certains installateurs refusent alors l'APK."
            exit 1
          }
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt || {
            echo "❌ Signature v2 absente : Android 7+ refuserait l'installation."
            exit 1
          }
          echo "✅ Signatures v1 + v2 vérifiées par apksigner."

          # 3) Le certificat doit être celui du keystore de production (si fourni).
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            if ! grep -qi "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" /tmp/apksigner.txt; then
              echo "❌ Le certificat de l'APK ne correspond pas au keystore de production."
              grep -i "certificate" /tmp/apksigner.txt || true
              exit 1
            fi
            echo "✅ Certificat conforme au keystore de production."
          fi

      - name: Vérifier l'APK release (manifeste, signature, intégrité, ABI)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=$(node -p "require('./app.json').expo.android.package")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          ARGS=(
            /tmp/dist/Batibuild-release.apk
            --expect-package "$BUNDLE"
            --expect-version-code "$CODE"
            --require-schemes v1,v2
          )
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            ARGS+=(--expect-cert-sha256 "$EXPECTED_CERT_SHA256" --require-release-cert)
          fi
          node scripts/verify-artifact.mjs "${ARGS[@]}"

      # Contrôle INDÉPENDANT du manifeste : aapt2 relit l'APK avec l'outil
      # officiel du SDK Android (aucun code du projet n'intervient).
      - name: Contrôle indépendant du manifeste (aapt2 badging)
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging /tmp/dist/Batibuild-release.apk > /tmp/badging.txt
          BUNDLE=$(node -p "require('./app.json').expo.android.package")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" /tmp/badging.txt | head -6
          grep -q "^package: name='${BUNDLE}'" /tmp/badging.txt || {
            echo "❌ applicationId inattendu dans l'APK :"
            grep '^package:' /tmp/badging.txt || true
            exit 1
          }
          grep -q "versionCode='${CODE}'" /tmp/badging.txt || {
            echo "❌ versionCode inattendu dans l'APK (attendu ${CODE})."
            exit 1
          }
          grep -q "^sdkVersion:" /tmp/badging.txt || { echo "❌ minSdkVersion absent du manifeste."; exit 1; }
          grep -q "^targetSdkVersion:" /tmp/badging.txt || { echo "❌ targetSdkVersion absent du manifeste."; exit 1; }
          if ! grep -q "^native-code:.*arm64-v8a\|^native-code:.*armeabi-v7a" /tmp/badging.txt; then
            echo "❌ Aucune ABI ARM dans l'APK :"
            grep '^native-code' /tmp/badging.txt || echo "   (aucune bibliothèque native)"
            exit 1
          fi
          echo "✅ Manifeste, applicationId, versionCode, SDK et ABI validés par aapt2."

      # (Pas d'upload ici : publication groupée en fin de job.)

      # ── AAB RELEASE (Google Play) ──────────────────────────────────────────
      - name: Build — AAB release
        run: bash scripts/ci-gradle.sh :app:bundleRelease aab

      - name: Préparer l'AAB release
        run: |
          mkdir -p /tmp/dist
          RELEASE_AAB=""
          if [ -d android/app/build/outputs/bundle/release ]; then
            RELEASE_AAB=$(find android/app/build/outputs/bundle/release -type f -name "*.aab" | head -1)
          fi
          if [ -z "$RELEASE_AAB" ]; then
            echo "❌ Aucun AAB trouvé dans android/app/build/outputs/bundle/release/"
            exit 1
          fi
          cp "$RELEASE_AAB" /tmp/dist/Batibuild-release.aab
          ls -lh /tmp/dist/Batibuild-release.aab

      - name: Vérifier l'AAB release (taille, ZIP, entrées)
        run: node scripts/verify-artifact.mjs /tmp/dist/Batibuild-release.aab --kind aab

      # ══════════════════════════════════════════════════════════════════════
      # PUBLICATION VERS NEXUS 3 (dépôt RAW) — REMPLACE LES ARTEFACTS GITHUB
      #
      # Les artefacts GitHub Actions ont provoqué :
      #   Failed to CreateArtifact: Artifact storage quota has been hit.
      # Ils ne sont plus utilisés du tout : les APK/AAB partent dans le Nexus 3
      # Repository Manager via `astertom/nexus-upload-artifact@v1`.
      #   · APK release + AAB release seulement — l'APK debug n'est pas produit ;
      #   · les 2 fichiers sont copiés dans `mobile/artifacts-release/`, car
      #     l'action cherche dans GITHUB_WORKSPACE (`directory` est relatif à la
      #     racine du dépôt — pas à `defaults.run.working-directory`) ;
      #   · `repositories` / `path` viennent des variables de dépôt
      #     NEXUS_REPOSITORIES / NEXUS_PATH (défauts « raw » et « /batibuild/ ») ;
      #   · aucun secret n'est jamais affiché : ils sont injectés via `env`.
      # Si les secrets NEXUS_* sont absents, l'étape est simplement ignorée :
      # la GitHub Release publiée plus bas assure alors la copie durable. Le
      # garde-fou final (APRÈS la publication) vérifie le résultat réel.
      # ══════════════════════════════════════════════════════════════════════
      - name: Contrôler les fichiers à publier (aucun fichier parasite)
        run: |
          set -euo pipefail
          for file in Batibuild-release.apk Batibuild-release.aab; do
            test -s "/tmp/dist/$file" || { echo "❌ /tmp/dist/$file manquant ou vide"; exit 1; }
          done
          UNEXPECTED=$(find /tmp/dist -maxdepth 1 -type f \
            ! -name 'Batibuild-release.apk' \
            ! -name 'Batibuild-release.aab' -print)
          if [ -n "$UNEXPECTED" ]; then
            echo "❌ Fichiers inattendus dans /tmp/dist (ils ne doivent PAS être publiés) :"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "✅ Exactement 2 fichiers à publier (APK release + AAB release), aucun fichier parasite :"
          ls -lh /tmp/dist

      # Les APK/AAB sortent de /tmp/dist (hors GITHUB_WORKSPACE) : ils sont
      # recopiés dans le workspace, où l'action Nexus va les chercher.
      - name: Préparer le dépôt Nexus (staging dans le workspace)
        run: |
          set -euo pipefail
          rm -rf artifacts-release
          mkdir -p artifacts-release
          cp /tmp/dist/Batibuild-release.apk /tmp/dist/Batibuild-release.aab artifacts-release/
          echo "✅ Fichiers prêts pour Nexus (mobile/artifacts-release) :"
          ls -lh artifacts-release

      # Upload vers le Nexus 3 RM — AUCUN quota GitHub consommé.
      - name: Upload — Nexus 3 (APK release + AAB release)
        id: nexus
        if: ${{ success() && env.NEXUS_HOST_URL != '' }}
        # `continue-on-error` : un Nexus mal configuré ne doit plus rendre le run
        # rouge alors que la GitHub Release (publiée juste après) conserve le
        # build. Le garde-fou final vérifie `steps.nexus.outcome` : sans Release
        # ET sans upload Nexus réussi, il échoue avec la cause exacte.
        continue-on-error: true
        uses: astertom/nexus-upload-artifact@v1
        env:
          NEXUS_HOST_URL: ${{ secrets.NEXUS_HOST_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        with:
          # Les 2 fichiers portent le préfixe « Batibuild-release. ».
          pattern: "Batibuild-release.*"
          repositories: ${{ vars.NEXUS_REPOSITORIES || 'raw' }}
          # Relatif à GITHUB_WORKSPACE (racine du dépôt).
          directory: "mobile/artifacts-release"
          path: ${{ vars.NEXUS_PATH || '/batibuild/' }}
          timeout: "300"

      # NOTE : le garde-fou « copie durable » n'est plus ici. Il était exécuté
      # AVANT la publication de la Release et se contentait de l'INTENTION
      # (`steps.dist.outputs.release`) : il échouait donc systématiquement quand
      # `publish_release` valait false et qu'aucun secret Nexus n'était défini,
      # même quand tout le reste du build était correct. Il est désormais placé
      # APRÈS la publication et vérifie les fichiers réellement transférés.

      # ══════════════════════════════════════════════════════════════════════
      # PUBLICATION EN GITHUB RELEASE — COPIE DURABLE, HORS QUOTA D'ARTEFACTS
      #
      # Les APK/AAB sont également attachés à une GitHub Release, dont le
      # stockage est distinct et bien plus large que celui des artefacts : les
      # builds versionnés y restent disponibles sans limite de 90 jours, sans
      # consommer le quota saturé.
      #
      # Pourquoi DANS ce job et pas dans un job séparé : les deux fichiers sont
      # déjà dans /tmp/dist sur ce runner ; un job séparé devrait les
      # retélécharger via le stockage d'artefacts — la ressource dont le quota
      # est justement plein. `always()` fait que la Release est publiée MÊME si
      # le build a échoué : l'APK reste récupérable malgré le quota. Et comme
      # aucun artefact Actions n'est créé dans ce cas, il n'y a jamais de doublon.
      #
      # Déclenchement : tag `v*`, lancement manuel (`publish_release`, défaut
      # true) ou push de branche (pré-version unique par run).
      # Toute la logique (validation du tag, notes de version avec empreintes
      # SHA-256, attachement des 2 fichiers, idempotence, lien dans le résumé du
      # run) vit dans `mobile/scripts/publish-release.sh`.
      # ══════════════════════════════════════════════════════════════════════
      - name: Publier la Release GitHub (APK + AAB attachés au tag)
        id: release
        if: ${{ always() && steps.dist.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.dist.outputs.tag }}
          RELEASE_VERSION: ${{ steps.dist.outputs.version }}
          RELEASE_CODE: ${{ steps.dist.outputs.code }}
          RELEASE_PRERELEASE: ${{ steps.dist.outputs.prerelease }}
        run: bash scripts/publish-release.sh

      # ══════════════════════════════════════════════════════════════════════
      # VÉRIFICATION DU FICHIER RÉELLEMENT TÉLÉCHARGEABLE
      #
      # Un APK validé sur le runner ne sert à rien si l'asset publié diffère.
      # On RETÉLÉCHARGE l'APK depuis la Release et on exige :
      #   · un SHA-256 identique à l'artefact vérifié ;
      #   · la même vérification complète (manifeste, signature, ABI).
      # C'est ce fichier-là que l'utilisateur installe.
      # ══════════════════════════════════════════════════════════════════════
      - name: Vérifier l'APK publié (retéléchargement + SHA-256 + signature)
        if: ${{ always() && steps.release.outcome == 'success' && steps.release.outputs.apk_url != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/published && mkdir -p /tmp/published
          gh release download "$RELEASE_TAG" \
            --pattern Batibuild-release.apk --dir /tmp/published --clobber
          LOCAL=$(sha256sum /tmp/dist/Batibuild-release.apk | cut -d' ' -f1)
          REMOTE=$(sha256sum /tmp/published/Batibuild-release.apk | cut -d' ' -f1)
          echo "Local  : $(stat -c%s /tmp/dist/Batibuild-release.apk) octets — $LOCAL"
          echo "Publié : $(stat -c%s /tmp/published/Batibuild-release.apk) octets — $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "❌ Le fichier publié DIFFÈRE de l'artefact vérifié (corruption au téléversement)."
            exit 1
          fi
          PACKAGE=$(node -p "require('./app.json').expo.android.package")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          node scripts/verify-artifact.mjs /tmp/published/Batibuild-release.apk \
            --expect-package "$PACKAGE" --expect-version-code "$CODE"
          echo "✅ L'APK téléchargé depuis la Release est identique à l'artefact validé."

      # ══════════════════════════════════════════════════════════════════════
      # GARDE-FOU FINAL — UNE COPIE DURABLE DOIT EXISTER RÉELLEMENT
      #
      # Exécuté APRÈS la publication (`!cancelled()`) : il ne juge plus une
      # intention mais des faits.
      #   1. GitHub Release : l'API atteste que la Release du tag contient bien
      #      `Batibuild-release.apk` ET `Batibuild-release.aab`, non vides.
      #   2. Nexus 3 : l'upload s'est terminé sans erreur.
      # Aucun secret Nexus n'est requis dès que la Release a réussi — c'est la
      # correction de l'erreur « Aucune copie durable du build ».
      # Si les APK/AAB n'ont pas été produits (build en échec), rien n'est
      # déclaré publié et le job reste rouge à cause de l'échec réel.
      # ══════════════════════════════════════════════════════════════════════
      - name: Vérifier qu'une copie durable existe (GitHub Release ou Nexus)
        id: durable
        # `!cancelled()` : s'exécute même après un échec, mais jamais pendant
        # l'annulation d'un run (toujours de `always()`).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_OUTCOME: ${{ steps.nexus.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          set -uo pipefail

          RELEASE_OK=0
          APK_SIZE=0
          AAB_SIZE=0

          if [ "${RELEASE_OUTCOME:-}" = "success" ] && [ -n "${RELEASE_TAG:-}" ]; then
            # Vérification par l'API GitHub : la Release existe ET porte les
            # deux fichiers attendus. Sonde indépendante de la sortie du script.
            ASSETS=$(gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[] | "\(.name) \(.size)"' 2>/dev/null || true)
            if [ -n "$ASSETS" ]; then
              APK_SIZE=$(printf '%s\n' "$ASSETS" | awk '$1 == "Batibuild-release.apk" { print $2 }' | head -1)
              AAB_SIZE=$(printf '%s\n' "$ASSETS" | awk '$1 == "Batibuild-release.aab" { print $2 }' | head -1)
              APK_SIZE=${APK_SIZE:-0}
              AAB_SIZE=${AAB_SIZE:-0}
              if [ "$APK_SIZE" -gt 0 ] && [ "$AAB_SIZE" -gt 0 ]; then
                RELEASE_OK=1
              fi
            fi
          fi

          if [ "$RELEASE_OK" = "1" ]; then
            echo "✅ Copie durable — GitHub Release ${RELEASE_TAG} :"
            echo "   · Batibuild-release.apk  (${APK_SIZE} octets)"
            echo "   · Batibuild-release.aab  (${AAB_SIZE} octets)"
            echo "   Aucun secret Nexus requis."
          fi

          if [ "${NEXUS_OUTCOME:-}" = "success" ]; then
            echo "✅ Copie durable — Nexus 3 : APK + AAB dans le dépôt RAW ${NEXUS_REPOSITORIES:-raw} sous ${NEXUS_PATH:-/batibuild/}."
          fi

          if [ "$RELEASE_OK" = "1" ] || [ "${NEXUS_OUTCOME:-}" = "success" ]; then
            echo "durable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "durable=false" >> "$GITHUB_OUTPUT"

          if [ ! -s /tmp/dist/Batibuild-release.apk ] || [ ! -s /tmp/dist/Batibuild-release.aab ]; then
            echo "⚠️  Aucun APK/AAB valide produit par ce run : rien ne pouvait être publié."
            echo "    Le job est déjà en échec sur la compilation (cause ci-dessus),"
            echo "    ce garde-fou ne déclare donc aucune publication."
            exit 0
          fi

          echo "❌ Aucune copie durable du build : les fichiers existent mais aucun"
          echo "   stockage permanent ne les contient."
          echo ""
          if [ "${RELEASE_OUTCOME:-}" = "failure" ]; then
            echo "   · GitHub Release : la publication a ÉCHOUÉ — cause exacte dans"
            echo "     l'étape « Publier la Release GitHub (APK + AAB attachés au tag) »."
          elif [ -z "${RELEASE_TAG:-}" ]; then
            echo "   · GitHub Release : aucune publication demandée pour ce run"
            echo "     (`publish_release` explicitement à false)."
          else
            echo "   · GitHub Release « ${RELEASE_TAG} » : APK et/ou AAB manquants (taille nulle)."
          fi
          echo "   · Nexus 3 : non configuré ou en échec (rôle : ${NEXUS_OUTCOME:-skipped})."
          echo ""
          echo "   Correctifs :"
          echo "   1. relancer le workflow avec « publish_release » = true (défaut) ;"
          echo "   2. ou définir les secrets NEXUS_HOST_URL / NEXUS_USER / NEXUS_TOKEN"
          echo "      (Settings → Secrets and variables → Actions)."
          exit 1

      # ── ARTEFACT ACTIONS DE SECOURS (COMPLÉMENT, JAMAIS BLOQUANT) ──────────
      # Le stockage d'artefacts GitHub peut être saturé (c'est ce qui avait
      # provoqué « Artifact storage quota has been hit »). Cet envoi est donc :
      #   · exécuté SEULEMENT si une copie durable existe déjà ;
      #   · non bloquant (`continue-on-error`) : un quota plein ne casse rien ;
      #   · limité à 5 jours de rétention (aligné sur ARTIFACT_RETENTION_DAYS).
      - name: Artefact Actions de secours (5 jours, non bloquant)
        if: ${{ steps.durable.outputs.durable == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: batibuild-release-${{ steps.dist.outputs.label || github.run_number }}
          path: |
            mobile/artifacts-release/Batibuild-release.apk
            mobile/artifacts-release/Batibuild-release.aab
          if-no-files-found: warn
          retention-days: 5
          compression-level: 0

      # ── DIAGNOSTIC VISIBLE EN CAS D'ÉCHEC ──────────────────────────────────
      # Ne masque rien : le job reste rouge. Affiche simplement la cause réelle
      # dans une étape dédiée, lisible même depuis le téléphone.
      - name: 🔍 Cause de l'échec (extrait des logs Gradle / publication)
        if: failure()
        # `steps.nexus.outcome` / `steps.release.outcome` distinguent un échec de
        # PUBLICATION d'un échec de COMPILATION Android.
        env:
          NEXUS_OUTCOME: ${{ steps.nexus.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          FOUND=0
          for log in /tmp/gradle-*.log; do
            [ -f "$log" ] || continue
            FOUND=1
            echo "════════════════ $log ════════════════"
            sed -n '/What went wrong/,/^\* Try:/p' "$log" | head -60
            echo "──────────────── tâches en échec ────────────────"
            grep -E "^> Task .*FAILED" "$log" | head -5
            echo "──────────────── signatures connues ────────────────"
            grep -n -E "OutOfMemoryError|Java heap space|Killed|No space left on device|ninja: build stopped|CMake Error|e: file" "$log" | head -10
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "Aucun log Gradle disponible : l'échec est survenu avant la compilation."
          fi

          if [ "${NEXUS_OUTCOME:-}" = "failure" ]; then
            echo ""
            echo "════════ PUBLICATION NEXUS 3 EN ÉCHEC ════════"
            echo "La compilation Android ci-dessus a réussi : c'est l'upload vers le"
            echo "Nexus 3 RM (astertom/nexus-upload-artifact@v1) qui a échoué."
            echo ""
            echo "À vérifier :"
            echo "  · NEXUS_HOST_URL joignable depuis le runner (URL publique) ;"
            echo "  · NEXUS_USER / NEXUS_TOKEN corrects et autorisés en écriture ;"
            echo "  · le dépôt RAW ${NEXUS_REPOSITORIES:-raw} existe et accepte le"
            echo "    chemin ${NEXUS_PATH:-/batibuild/}."
            echo ""
            echo "Autre voie : relancez le workflow avec « publish_release » = true"
            echo "pour attacher les APK/AAB à une GitHub Release."
            echo "══════════════════════════════════════════════"
          fi

          if [ "${RELEASE_OUTCOME:-}" = "failure" ]; then
            echo ""
            echo "════════ PUBLICATION GITHUB RELEASE EN ÉCHEC ════════"
            echo "La compilation Android a réussi : c'est la GitHub Release"
            echo "« ${RELEASE_TAG:-?} » qui n'a pas pu être créée/mise à jour."
            echo ""
            echo "À vérifier :"
            echo "  · permission \`contents: write\` du workflow (GITHUB_TOKEN) ;"
            echo "  · protection du tag / de la branche (Settings → Rules) ;"
            echo "  · la limite de taille des fichiers attachés à une Release."
            echo "La cause exacte est imprimée dans l'étape de publication ci-dessus."
            echo "═════════════════════════════════════════════════════"
          fi

          echo "── Ressources au moment de l'échec ──"
          free -m | head -2
          df -h / | tail -1
          echo ""
          echo "BUILD FAILED"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## ❌ BUILD FAILED"
              echo ""
              echo "Aucun artefact valide n'a été publié : la cause exacte est ci-dessus."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Résumé du build
        run: |
          # Version réellement compilée : permet d'identifier l'APK téléchargé.
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "## ✅ BUILD SUCCESS — Build Android terminé" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Les fichiers ci-dessous ont été vérifiés (taille, structure ZIP, entrées obligatoires, signature)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**batibuild ${VERSION} — versionCode ${CODE}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fichier | Taille |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/dist/*; do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ABI compilées : \`$ARCHITECTURES\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/apksigner.txt ]; then
            CERT_SUBJECT=$(grep -m1 "certificate DN:" /tmp/apksigner.txt | sed 's/^ *//' || true)
            CERT_SHA=$(grep -m1 "certificate SHA-256 digest:" /tmp/apksigner.txt | sed 's/^ *//' || true)
            if [ -n "$CERT_SUBJECT" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Signature** : \`${CERT_SUBJECT}\`" >> "$GITHUB_STEP_SUMMARY"
              [ -n "$CERT_SHA" ] && echo "**Empreinte** : \`${CERT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "${PRODUCTION_SIGNING:-false}" = "true" ]; then
            echo "**Keystore** : ✅ keystore de production (secrets) — mises à jour Android compatibles." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Keystore** : ⚠️ aucun keystore de production — APK signé avec la clé **debug** (installation sur téléphone vierge uniquement)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Si Android répond « le package semble ne pas être valide », une version de batibuild signée avec une AUTRE clé est déjà installée : désinstaller l'ancienne application, puis réinstaller cet APK." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.durable.outputs.durable }}" = "true" ]; then
            echo "**Copie durable** : ✅ vérifiée (les deux fichiers sont réellement stockés)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Copie durable** : ❌ aucune — voir le garde-fou « Vérifier qu'une copie durable existe »." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.nexus.outcome }}" = "success" ]; then
            echo "**Nexus 3** : APK release + AAB release poussés dans le dépôt RAW \`${NEXUS_REPOSITORIES:-raw}\` sous \`${NEXUS_PATH:-/batibuild/}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Nexus 3** : non configuré (secrets \`NEXUS_*\` absents) — aucune copie Nexus créée." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.release.outputs.url }}" ]; then
            echo "**GitHub Release** : [\`${{ steps.dist.outputs.tag }}\`](${{ steps.release.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Téléchargement direct | Lien |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| APK release (téléphone) | [${{ steps.release.outputs.apk_name }}](${{ steps.release.outputs.apk_url }}) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| AAB release (Google Play) | [${{ steps.release.outputs.aab_name }}](${{ steps.release.outputs.aab_url }}) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> **Conservation durable** : la GitHub Release n'a pas été publiée. Relancez avec \`publish_release\` = true (défaut) ou configurez les secrets Nexus." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Téléphone branché en USB : \`adb install -r Batibuild-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
          ls -lh /tmp/dist
