# batibuild Mobile — Build Android 100 % autonome sur GitHub Actions
#
# Flux : git push origin main → runner ubuntu-latest → Node 22 + Bun + JDK 17
#        → setup-android@v4 (SDK + licences) → npm/bun install → prebuild
#        (si android/ absent) → composants SDK du projet → Gradle
#        → Batibuild-debug.apk + Batibuild-release.apk + Batibuild-release.aab
#        → Artifacts du run.
#
# AUCUN outil Android n'est requis sur votre PC : ni JDK, ni Android SDK,
# ni Android Studio, ni Gradle. Tout est installé par le runner.
#
# Secrets GitHub FACULTATIFS (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64    keystore Release encodé en base64
#   KEYSTORE_PASSWORD  mot de passe (store + clé)
#   KEYSTORE_ALIAS     alias de la clé
# Sans eux, le build RÉUSSIT quand même : l'APK/AAB release est signé avec la
# clé debug (installable pour tester, refusé par Google Play). Aucun secret
# n'est jamais affiché dans les logs.
#
# La clé DEBUG (android/app/debug.keystore, alias `androiddebugkey`, mot de passe
# `android`) est versionnée dans le dépôt : ce n'est pas un secret de production.
# Une étape la régénère automatiquement si elle manque (scripts/ensure-debug-keystore.mjs),
# ce qui évite l'échec « :app:validateSigningDebug » sur un runner vierge.
#
# Ce workflow n'utilise PAS EAS et n'a besoin d'aucun EXPO_TOKEN.
#
# ── SDK Android : MÉTHODE UNIQUE ────────────────────────────────────────────
# Le SDK est installé par `android-actions/setup-android@v4` : c'est lui qui
# télécharge les cmdline-tools, accepte les licences lui-même
# (`accept-android-sdk-licenses: true`, sans journalisation) et installe
# `platform-tools`. Aucun cmdline-tools n'est téléchargé à la main et AUCUNE
# commande `sdkmanager --licenses` n'est exécutée par le workflow.
#
# L'ancien SDK préinstallé de l'image du runner (cmdline-tools 12.0 dans
# `cmdline-tools/latest`) est supprimé et retiré du PATH AVANT l'appel à
# l'action : c'est ce conflit qui provoquait « Wrong version in preinstalled
# sdkmanager » puis l'échec de l'acceptation des licences (« Fetch remote
# repository »). Après l'action, PATH et ANDROID_SDK_ROOT / ANDROID_HOME sont
# normalisés puis vérifiés : un SEUL sdkmanager reste résoluble, et il
# appartient au SDK configuré.
#
# Les composants exigés par le projet (plateforme, build-tools, NDK, CMake)
# sont lus dans le catalogue React Native du projet
# (`mobile/node_modules/react-native/gradle/libs.versions.toml`) : aucune
# version n'est imposée en dur, la configuration Android existante est suivie.
#
# ── Diagnostic d'échec ──────────────────────────────────────────────────────
# Les tâches Gradle sont lancées via `mobile/scripts/ci-gradle.sh` : en cas
# d'échec, le script extrait la section « What went wrong » (la CAUSE RÉELLE),
# la liste des tâches en échec et les signatures connues (OOM, disque plein,
# ninja/CMake, erreur compilateur), et la publie dans le résumé du run.
# `--stacktrace` reste actif pour ne rien masquer.

name: Android — APK & AAB

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABI à compiler (arm64-v8a,armeabi-v7a = téléphones réels)"
        required: false
        default: "arm64-v8a,armeabi-v7a"
      force_prebuild:
        description: "Forcer « expo prebuild » (resynchroniser android/ depuis app.json)"
        type: boolean
        required: false
        default: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  # Mémoire du bundler JS (Metro / expo export:embed)
  NODE_OPTIONS: "--max-old-space-size=8192"
  # ABI ciblées : 2 ABI au lieu de 4 → build ~2× plus rapide et 2× moins de
  # mémoire (nécessaire sur un runner). Modifiable au lancement manuel.
  ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
  # Compilation C++ (CMake/ninja) : chaque processus clang++ consomme ~1,5 Go.
  # Le runner a 4 vCPU et ~16 Go ; sans limite, les 2 ABI compilées en parallèle
  # saturent la RAM et le noyau tue les compilateurs (« Killed »), ce qui se
  # traduit par un échec Gradle tardif et illisible. 2 = marge de sécurité.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-android:
    name: APK debug + APK release + AAB release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun (lockfile du projet)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ══════════════════════════════════════════════════════════════════════
      # CONFIGURATION DU SDK ANDROID — MÉTHODE UNIQUE
      #
      # CAUSE DE L'ÉCHEC CORRIGÉE ICI : l'image du runner embarque un SDK
      # préinstallé dont les cmdline-tools 12.0 (`cmdline-tools/latest`) étaient
      # résolus AVANT ceux de l'action. setup-android détectait alors
      # « Wrong version in preinstalled sdkmanager », téléchargeait une autre
      # version, puis l'acceptation des licences / « Fetch remote repository »
      # échouait — et le `sdkmanager --licenses` manuel du workflow utilisait ce
      # même ancien binaire.
      #
      # Le SDK est donc maintenant configuré en TROIS temps, sans aucune
      # installation manuelle de cmdline-tools et sans aucune commande
      # `sdkmanager --licenses` :
      #   1. l'emplacement du SDK est fixé (et l'ancien sdkmanager supprimé) ;
      #   2. setup-android@v4 installe ses propres cmdline-tools, accepte LES
      #      licences lui-même et installe platform-tools ;
      #   3. PATH et variables d'environnement sont normalisés : un SEUL
      #      sdkmanager reste résoluble, et il appartient au SDK configuré.
      # ══════════════════════════════════════════════════════════════════════

      - name: Préparer l'emplacement du SDK Android (supprimer l'ancien sdkmanager)
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_SDK="/usr/local/lib/android/sdk"
          SDK_ROOT="$IMAGE_SDK"

          # SDK de l'image non inscriptible (ou absent) → SDK propre au runner.
          # L'ancien SDK n'est alors plus utilisé : on récupère son espace disque.
          if [ ! -d "$SDK_ROOT" ] || [ ! -w "$SDK_ROOT" ]; then
            SDK_ROOT="${RUNNER_TEMP}/android-sdk"
            echo "ℹ️  SDK de l'image absent ou non inscriptible → SDK du build : $SDK_ROOT"
            if [ -d "$IMAGE_SDK" ]; then
              sudo rm -rf "$IMAGE_SDK" 2>/dev/null \
                || rm -rf "$IMAGE_SDK" 2>/dev/null \
                || echo "⚠️  ancien SDK non supprimable (ignoré : optimisation d'espace disque uniquement)"
            fi
          fi
          mkdir -p "$SDK_ROOT"

          # Ancien sdkmanager préinstallé (cmdline-tools 12.0 / 16.0) : SUPPRIMÉ
          # pour qu'il ne puisse plus être résolu par PATH ni entrer en conflit
          # avec celui que setup-android@v4 installe dans cmdline-tools/<version>.
          if [ -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            echo "Suppression de l'ancien sdkmanager préinstallé : $SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null \
              || sudo rm -rf "$SDK_ROOT/cmdline-tools/latest"
          fi

          # PATH nettoyé : plus aucun chemin d'un SDK Android préinstallé.
          # (L'action ajoutera ensuite SES dossiers en tête de PATH.)
          CLEAN_PATH=""
          IFS=':' read -r -a ENTRIES <<< "$PATH"
          for entry in "${ENTRIES[@]}"; do
            [ -n "$entry" ] || continue
            case "$entry" in
              */cmdline-tools/*) continue ;;
              "$IMAGE_SDK" | "$IMAGE_SDK"/*) continue ;;
              /usr/lib/android-sdk | /usr/lib/android-sdk/*) continue ;;
              /opt/android* | /opt/android*/*) continue ;;
            esac
            CLEAN_PATH="${CLEAN_PATH:+$CLEAN_PATH:}$entry"
          done

          # Variables officielles : identiques pour TOUTES les étapes suivantes.
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          # Une seule ligne → ajoutée en tête de PATH pour les étapes suivantes.
          echo "$CLEAN_PATH" >> "$GITHUB_PATH"

          echo "✅ Emplacement du SDK Android : $SDK_ROOT"
          echo "   cmdline-tools présents : $(ls "$SDK_ROOT/cmdline-tools" 2>/dev/null || echo 'aucun — installés par setup-android')"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Vérifier le SDK Android et normaliser PATH
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "❌ ANDROID_SDK_ROOT / ANDROID_HOME non défini par setup-android."
            exit 1
          fi

          # Un SEUL sdkmanager, et il doit appartenir au SDK configuré.
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "❌ sdkmanager introuvable dans le PATH."
            exit 1
          fi
          case "$SDK_MANAGER" in
            "$SDK_ROOT"/*) ;;
            *)
              echo "❌ sdkmanager résolu HORS du SDK configuré : $SDK_MANAGER (SDK_ROOT=$SDK_ROOT)"
              exit 1
              ;;
          esac
          TOOLS_DIR="$(dirname "$SDK_MANAGER")"

          # PATH final : outils du SDK de l'action en tête, aucun chemin d'un SDK
          # préinstallé, et plus aucun dossier cmdline-tools concurrent.
          CLEAN_PATH="$TOOLS_DIR:$SDK_ROOT/platform-tools"
          IFS=':' read -r -a ENTRIES <<< "$PATH"
          for entry in "${ENTRIES[@]}"; do
            [ -n "$entry" ] || continue
            case "$entry" in
              "$TOOLS_DIR" | "$SDK_ROOT/platform-tools") continue ;;
              */cmdline-tools/*) continue ;;
              /usr/local/lib/android/sdk | /usr/local/lib/android/sdk/*) continue ;;
              /usr/lib/android-sdk | /usr/lib/android-sdk/*) continue ;;
              /opt/android* | /opt/android*/*) continue ;;
            esac
            CLEAN_PATH="$CLEAN_PATH:$entry"
          done

          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$CLEAN_PATH" >> "$GITHUB_PATH"

          echo "✅ ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "✅ ANDROID_HOME=$SDK_ROOT"
          echo "✅ sdkmanager résolu : $SDK_MANAGER"
          echo "✅ sdkmanager --version : $(sdkmanager --version)"

      - name: Install dependencies (lockfile auto-détecté)
        run: |
          if [ -f package-lock.json ]; then
            echo "→ package-lock.json détecté : npm ci"
            npm ci
          elif [ -f bun.lock ]; then
            echo "→ bun.lock détecté : bun install --frozen-lockfile"
            bun install --frozen-lockfile
          elif [ -f bun.lockb ]; then
            echo "→ bun.lockb détecté : bun install --frozen-lockfile"
            bun install --frozen-lockfile
          else
            echo "→ aucun lockfile : npm install"
            npm install
          fi

      - name: Typecheck (échec rapide avant le build lourd)
        run: npx tsc --noEmit

      - name: Projet natif Android (prebuild uniquement si nécessaire)
        run: |
          if [ "${{ inputs.force_prebuild }}" = "true" ] || [ ! -f android/app/build.gradle ]; then
            echo "→ « expo prebuild » : génération / resynchronisation de android/"
            npx expo prebuild --platform android --no-install
            node scripts/apply-signing.mjs
          else
            echo "✅ Projet natif android/ déjà présent dans le dépôt — prebuild inutile."
          fi
          chmod +x android/gradlew
          test -f android/app/build.gradle
          test -x android/gradlew
          echo "Projet natif prêt : $(grep -c '' android/app/build.gradle) lignes dans android/app/build.gradle"

      # ── CLÉ DE SIGNATURE DEBUG ─────────────────────────────────────────────
      # android/app/build.gradle déclare `signingConfigs.debug { storeFile
      # file('debug.keystore') }`. Sans ce fichier, Gradle échoue APRÈS la
      # compilation complète :
      #   Execution failed for task ':app:validateSigningDebug'.
      #   > Keystore file '.../android/app/debug.keystore' not found for signing config 'debug'.
      # La clé debug standard est versionnée dans le dépôt ; cette étape la
      # régénère si elle manque (clone vierge, android/ resynchronisé).
      # Ce n'est pas un secret de production (alias androiddebugkey / « android »).
      - name: Clé de signature debug (générée si absente)
        run: |
          echo "Checking Android debug signing configuration..."
          node scripts/ensure-debug-keystore.mjs
          ls -la android/app/debug.keystore

      # ── COMPOSANTS ANDROID SDK RÉELLEMENT NÉCESSAIRES AU PROJET ────────────
      # Versions AUTO-DÉTECTÉES dans le catalogue du projet
      # (`node_modules/react-native/gradle/libs.versions.toml`, avec repli sur
      # les versions actuelles de React Native) : aucune version n'est imposée
      # en dur, la plateforme et les build-tools suivent la configuration
      # Android EXISTANTE du projet (compileSdk 36 aujourd'hui).
      #
      # Les licences SDK sont acceptées par setup-android@v4 lui-même : plus
      # aucun `sdkmanager --licenses` ici.
      - name: Installation des composants Android SDK du projet
        shell: bash
        run: |
          set -euo pipefail

          CATALOG=node_modules/react-native/gradle/libs.versions.toml

          read_version() {
            # awk renvoie toujours 0 → pas de « || true » masquant une erreur.
            local key="$1" fallback="$2" value=""
            if [ -f "$CATALOG" ]; then
              value=$(awk -v k="$key" '$1==k { gsub(/\"/,"",$3); print $3; exit }' "$CATALOG")
            fi
            if [ -z "$value" ]; then value="$fallback"; fi
            printf '%s' "$value"
          }

          COMPILE_SDK=$(read_version compileSdk 36)
          TARGET_SDK=$(read_version targetSdk 36)
          BUILD_TOOLS=$(read_version buildTools 36.0.0)
          NDK_VERSION=$(read_version ndkVersion 27.1.12297006)
          # CMake 3.22.1 = version par défaut d'AGP 8.12 (utilisée par
          # expo-modules-core). Installé explicitement : évite tout
          # téléchargement automatique hasardeux en pleine compilation.
          CMAKE_VERSION=3.22.1
          echo "Versions lues dans le projet : compileSdk=$COMPILE_SDK targetSdk=$TARGET_SDK buildTools=$BUILD_TOOLS ndk=$NDK_VERSION cmake=$CMAKE_VERSION"

          # UN SEUL SDK : celui configuré par setup-android@v4 (puis normalisé par
          # l'étape « Vérifier le SDK Android et normaliser PATH »). L'ancien SDK
          # préinstallé de l'image n'est jamais utilisé.
          SDK_ROOT="${ANDROID_SDK_ROOT:?SDK Android non configuré — étape « Setup Android SDK » manquante}"
          test -d "$SDK_ROOT"

          echo "── Libération d'espace disque (composants préinstallés inutiles) ──"
          df -h / | tail -1
          # Le runner embarque plusieurs NDK (≥ 2 Go chacun), les images
          # d'émulateur et les sources Android : plusieurs Go récupérables.
          if [ -d "$SDK_ROOT/ndk" ]; then
            for d in "$SDK_ROOT/ndk"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "$NDK_VERSION" ]; then
                echo "  - suppression ndk/$(basename "$d")"
                rm -rf "$d" 2>/dev/null || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          for obsolete in system-images emulator sources skins; do
            if [ -e "$SDK_ROOT/$obsolete" ]; then
              echo "  - suppression $obsolete/"
              rm -rf "$SDK_ROOT/$obsolete" 2>/dev/null || echo "    (non supprimable, ignoré)"
            fi
          done
          if [ -d "$SDK_ROOT/platforms" ]; then
            for d in "$SDK_ROOT/platforms"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "android-${COMPILE_SDK}" ]; then
                echo "  - suppression platforms/$(basename "$d")"
                rm -rf "$d" 2>/dev/null || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          if [ -d "$SDK_ROOT/build-tools" ]; then
            for d in "$SDK_ROOT/build-tools"/*; do
              [ -e "$d" ] || continue
              if [ "$(basename "$d")" != "$BUILD_TOOLS" ]; then
                echo "  - suppression build-tools/$(basename "$d")"
                rm -rf "$d" 2>/dev/null || echo "    (non supprimable, ignoré)"
              fi
            done
          fi
          df -h / | tail -1

          # LICENCES : elles sont acceptées par setup-android@v4
          # (`accept-android-sdk-licenses: true`, journalisation désactivée).
          # AUCUN `sdkmanager --licenses` n'est exécuté ici : cet appel manuel
          # résolvait l'ancien sdkmanager préinstallé et provoquait l'échec
          # « Fetch remote repository ».
          test -d "$SDK_ROOT/licenses"
          test -n "$(ls -A "$SDK_ROOT/licenses")"
          echo "Licences acceptées : $(ls "$SDK_ROOT/licenses" | tr '\n' ' ')"

          echo "── Installation des paquets requis (sdkmanager du SDK configuré) ──"
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

          # Vérification réelle : les composants EXIGÉS par le projet sont bien
          # installés dans le SDK configuré (aucun contournement si absent).
          test -d "$SDK_ROOT/platforms/android-${COMPILE_SDK}"
          test -d "$SDK_ROOT/build-tools/${BUILD_TOOLS}"
          test -d "$SDK_ROOT/ndk/${NDK_VERSION}"
          test -d "$SDK_ROOT/cmake/${CMAKE_VERSION}"

          echo "── Contenu du SDK : $SDK_ROOT ──"
          ls "$SDK_ROOT"
          ls "$SDK_ROOT/platforms"
          ls "$SDK_ROOT/build-tools"
          ls "$SDK_ROOT/cmake"
          ls "$SDK_ROOT/ndk"
          df -h / | tail -1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package.json', 'mobile/bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ══════════════════════════════════════════════════════════════════════
      # VÉRIFICATION AVANT BUILD — Java, SDK, adb, chemins
      # Échoue immédiatement (4 secondes) si un outil manque, si le SDK n'est
      # pas celui configuré, ou si un ancien sdkmanager préinstallé était
      # redevenu prioritaire dans PATH.
      # ══════════════════════════════════════════════════════════════════════
      - name: Vérification avant build (Java, Android SDK, adb, PATH)
        shell: bash
        run: |
          set -euo pipefail

          echo "── Java (JDK 17 Temurin) ──"
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

          echo "── Node / npm / Bun ──"
          node --version
          npm --version
          bun --version

          echo "── Android SDK ──"
          sdkmanager --version
          adb version
          echo "$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"

          echo "── Outils réellement résolus par PATH ──"
          SDK_MANAGER="$(command -v sdkmanager)"
          ADB="$(command -v adb)"
          echo "sdkmanager → $SDK_MANAGER"
          echo "adb        → $ADB"
          case "$SDK_MANAGER" in
            "$ANDROID_SDK_ROOT"/*) echo "✅ sdkmanager appartient au SDK configuré" ;;
            *)
              echo "❌ sdkmanager résolu hors du SDK configuré ($ANDROID_SDK_ROOT)."
              exit 1
              ;;
          esac
          case "$ADB" in
            "$ANDROID_SDK_ROOT"/*) echo "✅ adb appartient au SDK configuré" ;;
            *)
              echo "❌ adb résolu hors du SDK configuré ($ANDROID_SDK_ROOT)."
              exit 1
              ;;
          esac
          if [ "${ANDROID_HOME:-}" != "$ANDROID_SDK_ROOT" ]; then
            echo "❌ ANDROID_HOME ($ANDROID_HOME) ≠ ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT)"
            exit 1
          fi
          echo "✅ ANDROID_HOME = ANDROID_SDK_ROOT = $ANDROID_SDK_ROOT"

          echo "── Ressources du runner ──"
          nproc
          free -m
          df -h /

          echo "── Gradle (wrapper du projet, aucun Gradle global) ──"
          test -x android/gradlew
          android/gradlew --version

      - name: Configurer la signature Release (secrets optionnels)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ℹ️  Aucun secret keystore configuré."
            echo "    → L'APK/AAB release sera signé avec la clé debug (tests uniquement)."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "❌ KEYSTORE_BASE64 est défini mais KEYSTORE_PASSWORD ou KEYSTORE_ALIAS manque."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/batibuild-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          # Vérification immédiate : évite une erreur de signature obscure 15 min plus tard.
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null 2>&1; then
            echo "❌ Keystore invalide : KEYSTORE_BASE64, KEYSTORE_PASSWORD ou KEYSTORE_ALIAS ne correspondent pas."
            exit 1
          fi
          echo "✅ Keystore décodé et validé (alias $KEYSTORE_ALIAS)."
          # Variables lues par android/app/build.gradle — rien n'est écrit dans le dépôt.
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "✅ Signature Release configurée (keystore externe, rien dans le dépôt)."

      # ── VÉRIFICATION DE LA SIGNATURE ───────────────────────────────────────
      # Échoue proprement (sans continue-on-error) si une config de signature
      # référence un fichier absent — détecté en quelques secondes au lieu de
      # 15 minutes de compilation. N'affiche aucun mot de passe.
      - name: Vérification de la signature (signingReport)
        run: bash scripts/ci-gradle.sh :app:signingReport signing

      # ── APK DEBUG ──────────────────────────────────────────────────────────
      # ci-gradle.sh affiche, en cas d'échec, la CAUSE RÉELLE du plantage.
      - name: Build — APK debug
        run: bash scripts/ci-gradle.sh :app:assembleDebug debug

      - name: Préparer l'APK debug
        run: |
          mkdir -p /tmp/dist
          DEBUG_APK=""
          if [ -d android/app/build/outputs/apk/debug ]; then
            DEBUG_APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -1)
          fi
          if [ -z "$DEBUG_APK" ]; then
            echo "❌ Aucun APK trouvé dans android/app/build/outputs/apk/debug/"
            exit 1
          fi
          cp "$DEBUG_APK" /tmp/dist/Batibuild-debug.apk
          ls -lh /tmp/dist/Batibuild-debug.apk
          # Preuve que l'APK est bien signé (aucun secret n'est affiché).
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$DEBUG_APK" | head -6

      - name: Upload — Batibuild-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-debug-apk
          path: /tmp/dist/Batibuild-debug.apk
          if-no-files-found: error

      # ── APK RELEASE ────────────────────────────────────────────────────────
      - name: Build — APK release
        run: bash scripts/ci-gradle.sh :app:assembleRelease release

      - name: Préparer l'APK release
        run: |
          mkdir -p /tmp/dist
          RELEASE_APK=""
          if [ -d android/app/build/outputs/apk/release ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          fi
          if [ -z "$RELEASE_APK" ]; then
            echo "❌ Aucun APK trouvé dans android/app/build/outputs/apk/release/"
            exit 1
          fi
          cp "$RELEASE_APK" /tmp/dist/Batibuild-release.apk
          ls -lh /tmp/dist/Batibuild-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$RELEASE_APK" | head -6

      - name: Upload — Batibuild-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-apk
          path: /tmp/dist/Batibuild-release.apk
          if-no-files-found: error

      # ── AAB RELEASE (Google Play) ──────────────────────────────────────────
      - name: Build — AAB release
        run: bash scripts/ci-gradle.sh :app:bundleRelease aab

      - name: Préparer l'AAB release
        run: |
          mkdir -p /tmp/dist
          RELEASE_AAB=""
          if [ -d android/app/build/outputs/bundle/release ]; then
            RELEASE_AAB=$(find android/app/build/outputs/bundle/release -type f -name "*.aab" | head -1)
          fi
          if [ -z "$RELEASE_AAB" ]; then
            echo "❌ Aucun AAB trouvé dans android/app/build/outputs/bundle/release/"
            exit 1
          fi
          cp "$RELEASE_AAB" /tmp/dist/Batibuild-release.aab
          ls -lh /tmp/dist/Batibuild-release.aab

      - name: Upload — Batibuild-release.aab
        uses: actions/upload-artifact@v4
        with:
          name: Batibuild-release-aab
          path: /tmp/dist/Batibuild-release.aab
          if-no-files-found: error

      # ── DIAGNOSTIC VISIBLE EN CAS D'ÉCHEC ──────────────────────────────────
      # Ne masque rien : le job reste rouge. Affiche simplement la cause réelle
      # dans une étape dédiée, lisible même depuis le téléphone.
      - name: 🔍 Cause de l'échec (extrait des logs Gradle)
        if: failure()
        run: |
          FOUND=0
          for log in /tmp/gradle-*.log; do
            [ -f "$log" ] || continue
            FOUND=1
            echo "════════════════ $log ════════════════"
            sed -n '/What went wrong/,/^\* Try:/p' "$log" | head -60
            echo "──────────────── tâches en échec ────────────────"
            grep -E "^> Task .*FAILED" "$log" | head -5
            echo "──────────────── signatures connues ────────────────"
            grep -n -E "OutOfMemoryError|Java heap space|Killed|No space left on device|ninja: build stopped|CMake Error|e: file" "$log" | head -10
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "Aucun log Gradle disponible : l'échec est survenu avant la compilation."
          fi
          echo "── Ressources au moment de l'échec ──"
          free -m | head -2
          df -h / | tail -1

      - name: Résumé du build
        run: |
          # Version réellement compilée : permet d'identifier l'APK téléchargé.
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "## ✅ Build Android terminé" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**batibuild ${VERSION} — versionCode ${CODE}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fichier | Taille |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/dist/*; do
            echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ABI compilées : \`$ARCHITECTURES\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Téléphone branché en USB : \`adb install -r Batibuild-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
          ls -lh /tmp/dist
